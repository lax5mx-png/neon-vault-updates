<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Shardcut</title>
<style>
:root{--sat:0px;--sab:0px;--ink:#f3efe6;--mute:#8e93a6;--panel:#1b1e29;--line:#2b3040;--pri:#ffc93c;--pri2:#ffc93c;--cy:#ffc93c;--gold:#ffc93c;--red:#ff5a4f;--sh:0 4px 0 #0b0d13}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#12141c;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;touch-action:none}
#cv{position:fixed;inset:0;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.ico{width:22px;height:22px;flex:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding:calc(14px + var(--sat)) 16px calc(16px + var(--sab));overflow-y:auto;touch-action:pan-y;z-index:5}
.screen.on{display:flex}
#home{background:#12141c}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:7px 13px 7px 9px;font-weight:900;font-size:15px}
.pill img{width:22px;height:22px}
.iconbtn{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--panel);border:2px solid var(--line)}
.logo{text-align:center;margin:34px 0 4px;position:relative}
.logo h1{margin:0;font-size:clamp(46px,15vw,68px);font-weight:900;font-style:italic;letter-spacing:-.04em;line-height:1;position:relative;z-index:1;display:inline-grid}
.logo h1 span{grid-area:1/1;color:var(--ink);text-shadow:0 5px 0 #0b0d13}
.logo h1 span.a{clip-path:polygon(0 0,100% 0,100% 38%,0 62%)}
.logo h1 span.b{clip-path:polygon(0 62%,100% 38%,100% 100%,0 100%);transform:translate(5px,4px);color:var(--pri)}
.logo .slash{display:none}
.logo p{margin:14px 0 0;color:var(--mute);font-weight:800;font-size:12.5px;letter-spacing:.18em;text-transform:uppercase}
.floaters{position:absolute;inset:-34px 0 auto;height:150px;pointer-events:none;z-index:0}
.floaters{display:none}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-10px) rotate(8deg)}}
.cards{display:grid;gap:10px;margin-top:22px}
.card{position:relative;text-align:left;border-radius:14px;padding:16px;background:var(--panel);border:2px solid var(--line);box-shadow:var(--sh);overflow:hidden;transition:transform .08s}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 #0b0d13}
.card h3{margin:0;font-size:20px;font-weight:900;letter-spacing:-.01em}
.card p{margin:4px 0 0;color:var(--mute);font-size:13.5px;line-height:1.35}
.card .best{position:absolute;right:16px;top:16px;text-align:right;font-size:11px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.card .best b{display:block;font-size:20px;color:var(--ink);letter-spacing:0}
.card.hero{background:var(--pri);border-color:#e0a91f;color:#17130a;padding:20px 16px;box-shadow:0 5px 0 #9a6e08}
.card.hero p{color:rgba(23,19,10,.75)}.card.hero .best{color:rgba(23,19,10,.6)}.card.hero .best b{color:#17130a}
.card.hero h3{font-size:26px}
.card .play{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:#17130a;color:var(--pri);font-weight:900;border-radius:99px;padding:8px 16px;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .card .best{position:static;text-align:left;margin-top:10px}
.tag{display:inline-block;font-size:10.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:#2b3040;margin-bottom:6px}
.tag.gold{background:var(--pri);color:#17130a}
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;border-radius:9px;background:var(--pri)}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 4px;border-radius:12px;background:var(--panel);border:2px solid var(--line);box-shadow:var(--sh);font-size:12px;font-weight:800;color:var(--mute);position:relative}
.nav button .ico{color:var(--ink)}
.nav .dot{position:absolute;top:8px;right:calc(50% - 22px);width:9px;height:9px;border-radius:50%;background:var(--pri);box-shadow:0 0 8px var(--pri)}
.head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.head h2{margin:0;font-size:24px;font-weight:900;flex:1}
.sub{color:var(--mute);font-size:13px}
/* missions */
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mt{aspect-ratio:1;border-radius:10px;background:var(--panel);border:2px solid var(--line);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:900;font-size:19px;position:relative}
.mt .st{font-size:10px;letter-spacing:1px;color:var(--gold)}.mt .st .off{color:rgba(255,255,255,.18)}
.mt.next{background:var(--pri);color:#17130a;border-color:#e0a91f;box-shadow:0 4px 0 #9a6e08}.mt.next .st{color:#17130a}
.mt.lock{opacity:.4}.mt.boss{border-color:#6c4a9e}
.mt .bossi{position:absolute;top:4px;right:6px;font-size:9px;color:#d9b8ff;font-weight:900}
/* shop */
.seg{display:flex;background:rgba(0,0,0,.3);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:10px;border-radius:11px;font-weight:800;color:var(--mute)}.seg button.on{background:rgba(255,255,255,.12);color:var(--ink)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.si{border-radius:12px;background:var(--panel);border:2px solid var(--line);box-shadow:var(--sh);padding:10px;text-align:left}
.si.eq{border-color:var(--pri)}
.si .pv{height:86px;border-radius:14px;position:relative;overflow:hidden;background:#0b0820}
.si .pv canvas{width:100%;height:100%;display:block}
.si b{display:block;margin:9px 2px 0;font-size:15px}
.si .pr{display:flex;align-items:center;gap:5px;margin:4px 2px 2px;font-weight:800;font-size:13px;color:var(--mute)}.si .pr img{width:16px;height:16px}
.si .pr.can{color:var(--gold)}
/* list rows */
.list{display:flex;flex-direction:column;gap:8px}
.lr{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;background:var(--panel);border:2px solid var(--line)}
.lr .t{flex:1;min-width:0}.lr .t b{display:block;font-size:15px}.lr .t span{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.lr .v{font-weight:900;font-size:17px}
.lr .badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.07);flex:none}
.lr.done .badge{background:var(--pri);color:#17130a}
.lr .bar{margin-top:7px}
.sw{width:50px;height:30px;border-radius:99px;background:rgba(255,255,255,.15);position:relative;flex:none;transition:.2s}.sw::after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--pri)}.sw.on::after{background:#17130a}.sw.on::after{left:23px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:12px;font-weight:900;font-size:16px;background:var(--pri);color:#17130a;box-shadow:0 4px 0 #9a6e08}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9a6e08}
.btn.ghost{background:#2b3040;color:var(--ink);box-shadow:0 4px 0 #0b0d13}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.danger{background:rgba(255,77,94,.18);color:#ff8a95;box-shadow:none}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + var(--sat)) 14px 0;display:none;z-index:4;pointer-events:none}
#hud.on{display:block}
.hrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.score{font-size:44px;font-weight:900;line-height:1;letter-spacing:-.03em;text-shadow:0 4px 0 #0b0d13;font-variant-numeric:tabular-nums}
.hbest{font-size:12px;font-weight:800;color:var(--mute);margin-top:4px;letter-spacing:.04em}
.hright{display:flex;align-items:center;gap:10px}
.lives{display:flex;gap:4px}
.lives i{width:28px;height:28px;display:grid;place-items:center;color:rgba(255,255,255,.22)}
.lives i.lost{color:#ff4d5e;filter:drop-shadow(0 0 6px #ff4d5e)}
.lives svg{width:100%;height:100%}
.timer{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;min-width:56px;text-align:right}
.timer.low{color:#ff5a6e;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
#pausebtn{pointer-events:auto;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(0,0,0,.3);border:1px solid var(--line)}
.goal{margin-top:10px;display:none;max-width:320px}
.goal.on{display:block}
.goal span{font-size:12.5px;font-weight:800;color:#e9e1ff}
.goal .bar{height:6px;margin-top:6px}
.powers{display:flex;gap:6px;margin-top:8px}
.pw{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.35);border-radius:99px;padding:4px 10px 4px 5px;font-size:11.5px;font-weight:900}
.pw img{width:20px;height:20px}.pw i{display:block;width:44px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}.pw i b{display:block;height:100%;background:#fff}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(8,9,14,.72)}
.ov.on{display:flex}
.box{width:100%;max-width:380px;border-radius:16px;background:var(--panel);border:2px solid var(--line);padding:24px 20px 20px;text-align:center;box-shadow:0 6px 0 #0b0d13;animation:popin .25s cubic-bezier(.2,.9,.3,1.3)}
@keyframes popin{from{transform:scale(.88);opacity:0}}
.box h2{margin:0;font-size:28px;font-weight:900;letter-spacing:-.01em}
.box .kick{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--cy);margin-bottom:6px}
.box p{color:var(--mute);margin:8px 0 0;font-size:14.5px;line-height:1.45}
.box .big{font-size:64px;font-weight:900;line-height:1;margin:14px 0 4px;letter-spacing:-.04em;text-shadow:0 5px 0 #0b0d13}
.box .stars{font-size:40px;letter-spacing:6px;margin:10px 0 0;color:rgba(255,255,255,.15)}
.box .stars b{color:var(--gold)}
.box .rows{margin:14px 0 4px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box .rows div{background:#12141c;border-radius:10px;padding:10px}.box .rows b{display:block;font-size:19px}.box .rows span{font-size:11.5px;color:var(--mute);font-weight:700}
.box .acts{display:grid;gap:8px;margin-top:18px}
.box .acts.two{grid-template-columns:1fr 1fr}
.earn{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-weight:900;color:var(--gold);background:#12141c;padding:7px 14px;border-radius:8px}
.earn img{width:20px;height:20px}
.rules{text-align:left;margin:14px 0 0;padding:0;list-style:none;display:grid;gap:7px}
.rules li{display:flex;gap:10px;align-items:center;background:#12141c;border-radius:10px;padding:10px 12px;font-size:14px;font-weight:700}
.rules li .ico{width:20px;height:20px;color:var(--cy)}
.newbest{display:inline-block;margin-top:6px;font-size:12px;font-weight:900;letter-spacing:.1em;color:#2a1300;background:var(--gold);border-radius:99px;padding:4px 10px}
#toast{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translate(-50%,20px);opacity:0;transition:.25s;background:var(--panel);border:2px solid var(--line);box-shadow:var(--sh);padding:12px 16px;border-radius:14px;font-weight:800;font-size:14px;z-index:40;pointer-events:none;display:flex;align-items:center;gap:10px;max-width:92%}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast img{width:26px;height:26px}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="screen on" id="home"></div>
<div class="screen" id="missions"></div>
<div class="screen" id="shop"></div>
<div class="screen" id="ach"></div>
<div class="screen" id="stats"></div>
<div class="screen" id="settings"></div>

<div id="hud">
  <div class="hrow">
    <div><div class="score" id="hscore">0</div><div class="hbest" id="hbest"></div></div>
    <div class="hright"><div class="lives" id="hlives"></div><div class="timer" id="htimer"></div><button id="pausebtn" aria-label="Pause"><svg class="ico" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></button></div>
  </div>
  <div class="goal" id="hgoal"><span id="hgoalt"></span><div class="bar"><i id="hgoalb" style="width:0"></i></div></div>
  <div class="powers" id="hpowers"></div>
</div>

<div class="ov" id="ov"><div class="box" id="ovbox"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* Shardcut artwork: gems, power gems, bombs and geodes, drawn once into small canvases (sprites) and reused every frame. */
(function () {
  const GEMS = {
    ruby:     {name:'Ruby', color:'red', c1:'#ff5470', c2:'#a3092c', glow:'#ff2d55', shape:'hex'},
    sapphire: {name:'Sapphire', color:'blue', c1:'#5cb3ff', c2:'#0c3a9e', glow:'#2f8cff', shape:'round'},
    emerald:  {name:'Emerald', color:'green', c1:'#4cf59a', c2:'#07704a', glow:'#22e07a', shape:'emerald'},
    amethyst: {name:'Amethyst', color:'purple', c1:'#cf96ff', c2:'#5a1aa8', glow:'#b061ff', shape:'prism'},
    topaz:    {name:'Topaz', color:'yellow', c1:'#ffe066', c2:'#b77a06', glow:'#ffcc1a', shape:'rhombus'},
    citrine:  {name:'Citrine', color:'orange', c1:'#ffab4d', c2:'#ad420a', glow:'#ff801a', shape:'trillion'},
    rose:     {name:'Rose quartz', color:'pink', c1:'#ff9ccf', c2:'#b02a6e', glow:'#ff5fb0', shape:'heart'},
    aqua:     {name:'Aquamarine', color:'cyan', c1:'#7af8f3', c2:'#0a7d8a', glow:'#20e0e0', shape:'cube'},
    diamond:  {name:'Diamond', color:'white', c1:'#ffffff', c2:'#8fb3cf', glow:'#cfeeff', shape:'round', rare:true}
  };
  const KINDS = Object.keys(GEMS).filter(k => !GEMS[k].rare);
  const COLOR_NAMES = {red:'red', blue:'blue', green:'green', purple:'purple', yellow:'yellow', orange:'orange', pink:'pink', cyan:'cyan', white:'white'};
  const POWERS = {
    freeze: {name:'Freeze', c1:'#e6fbff', c2:'#3aa6d8', glow:'#9fe8ff', shape:'cube', icon:'snow'},
    frenzy: {name:'Frenzy', c1:'#fff1a8', c2:'#d98a00', glow:'#ffd21f', shape:'star', icon:'bolt'},
    double: {name:'Double', c1:'#c6ffb0', c2:'#2f9a17', glow:'#7dff4d', shape:'hex', icon:'x2'}
  };

  const SHAPES = {
    hex: [...Array(6)].map((_, i) => [Math.cos(-Math.PI / 2 + i * Math.PI / 3), Math.sin(-Math.PI / 2 + i * Math.PI / 3)]),
    round: [...Array(10)].map((_, i) => [Math.cos(-Math.PI / 2 + i * Math.PI / 5), Math.sin(-Math.PI / 2 + i * Math.PI / 5)]),
    emerald: [[-.52, -.86], [.52, -.86], [.8, -.58], [.8, .58], [.52, .86], [-.52, .86], [-.8, .58], [-.8, -.58]],
    prism: [[0, -1], [.52, -.56], [.52, .7], [.24, .96], [-.24, .96], [-.52, .7], [-.52, -.56]],
    rhombus: [[0, -1], [.74, 0], [0, 1], [-.74, 0]],
    trillion: [[0, -1], [.18, -.72], [.9, .46], [.78, .6], [-.78, .6], [-.9, .46], [-.18, -.72]],
    star: [...Array(10)].map((_, i) => { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? .48 : 1; return [Math.cos(a) * r, Math.sin(a) * r]; })
  };

  function mk(size) { const c = document.createElement('canvas'); c.width = c.height = Math.ceil(size); return c; }
  const LIGHT = [-.55, -.83]; // light from the top left

  function facetGem(g, pts, R, d, inset) {
    const P = pts.map(([x, y]) => [x * R, y * R]);
    const I = pts.map(([x, y]) => [x * R * (inset || .52), y * R * (inset || .52) - R * .06]);
    const path = a => { g.beginPath(); a.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); };
    // glow + body
    g.save(); g.shadowColor = d.glow; g.shadowBlur = R * .55;
    const gr = g.createLinearGradient(-R, -R, R, R); gr.addColorStop(0, d.c1); gr.addColorStop(1, d.c2);
    path(P); g.fillStyle = gr; g.fill(); g.restore();
    // facets, shaded by how they face the light
    for (let i = 0; i < P.length; i++) {
      const j = (i + 1) % P.length, mx = (P[i][0] + P[j][0]) / 2, my = (P[i][1] + P[j][1]) / 2, l = Math.hypot(mx, my) || 1;
      const dot = (mx / l) * LIGHT[0] + (my / l) * LIGHT[1];
      g.beginPath(); g.moveTo(P[i][0], P[i][1]); g.lineTo(P[j][0], P[j][1]); g.lineTo(I[j][0], I[j][1]); g.lineTo(I[i][0], I[i][1]); g.closePath();
      g.fillStyle = dot > 0 ? `rgba(255,255,255,${.12 + dot * .32})` : `rgba(0,0,0,${.08 - dot * .3})`; g.fill();
      // a split down each facet adds sparkle
      if (i % 2 === 0) { g.beginPath(); g.moveTo(mx, my); g.lineTo((I[i][0] + I[j][0]) / 2, (I[i][1] + I[j][1]) / 2); g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = R * .02; g.stroke(); }
    }
    // table (top face)
    const tg = g.createLinearGradient(0, -R * .6, 0, R * .5); tg.addColorStop(0, 'rgba(255,255,255,.55)'); tg.addColorStop(.55, 'rgba(255,255,255,.1)'); tg.addColorStop(1, 'rgba(255,255,255,.22)');
    path(I); g.fillStyle = d.c1; g.fill(); g.fillStyle = tg; g.fill();
    g.lineJoin = 'round';
    for (let i = 0; i < P.length; i++) { g.beginPath(); g.moveTo(P[i][0], P[i][1]); g.lineTo(I[i][0], I[i][1]); g.strokeStyle = 'rgba(255,255,255,.4)'; g.lineWidth = R * .025; g.stroke(); }
    path(I); g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = R * .03; g.stroke();
    path(P); g.strokeStyle = shade(d.c2, -.25); g.lineWidth = R * .05; g.stroke();
    glint(g, -R * .34, -R * .42, R * .2);
  }
  function cube(g, R, d) {
    const P = SHAPES.hex.map(([x, y]) => [x * R * .95, y * R * .95]);
    g.save(); g.shadowColor = d.glow; g.shadowBlur = R * .55; g.beginPath(); P.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); g.fillStyle = d.c2; g.fill(); g.restore();
    const face = (pts, col) => { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); g.fillStyle = col; g.fill(); g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = R * .03; g.stroke(); };
    face([P[0], P[1], [0, 0], P[5]], shade(d.c1, .25));
    face([P[5], [0, 0], P[3], P[4]], shade(d.c1, -.05));
    face([[0, 0], P[1], P[2], P[3]], shade(d.c2, .15));
    // frosty inner lines
    g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = R * .02;
    g.beginPath(); g.moveTo(-R * .5, -R * .05); g.lineTo(-R * .2, R * .45); g.moveTo(R * .25, R * .1); g.lineTo(R * .55, -R * .1); g.stroke();
    glint(g, -R * .2, -R * .55, R * .18);
  }
  function heart(g, R, d) {
    const path = () => { g.beginPath(); g.moveTo(0, R * .95); g.bezierCurveTo(-R * 1.25, R * .1, -R * .8, -R * 1.05, 0, -R * .45); g.bezierCurveTo(R * .8, -R * 1.05, R * 1.25, R * .1, 0, R * .95); g.closePath(); };
    g.save(); g.shadowColor = d.glow; g.shadowBlur = R * .55; const gr = g.createLinearGradient(-R, -R, R, R); gr.addColorStop(0, d.c1); gr.addColorStop(1, d.c2); path(); g.fillStyle = gr; g.fill(); g.restore();
    g.save(); path(); g.clip();
    // facet lines

      html = `<div class="kick">${r.kind === 'daily' ? 'Daily challenge' : 'Mission ' + (r.idx + 1)}</div><h2>${won ? 'Complete!' : 'Mission failed'}</h2>
        ${won ? `<div class="stars">${[1, 2, 3].map(k => k <= stars ? '<b>★</b>' : '★').join('')}</div>` : `<p>${why} ${esc(goalText(q))}.</p>`}
        <div class="big" style="font-size:48px">${fmt(res.score)}</div><p style="margin-top:0">points</p>${won && stars < 3 ? `<p style="font-size:13px">${stars === 2 ? 'For the last star' : 'For more stars'}: ${[res.misses ? 'no misses or bombs' : '', res.score < q.par ? q.par + '+ points' : ''].filter(Boolean).join(' and ')}</p>` : ''}
        ${rowsHtml}${earned ? `<div class="earn">${shardImg}+${fmt(earned)} shards</div>` : ''}
        <div class="acts ${nextOk ? '' : 'two'}">${nextOk ? `<button class="btn" data-act="next">Next mission</button><div class="acts two" style="margin:0"><button class="btn ghost" data-act="home">Menu</button><button class="btn ghost" data-act="again">Retry</button></div>` : `<button class="btn ghost" data-act="home">Menu</button><button class="btn" data-act="again">${won ? 'Play again' : 'Retry'}</button>`}</div>`;
      won ? SFX.win() : SFX.lose();
    }
    P.shards += earned; save();
    ovKind = 'result'; overlay(html);
    checkAch();
  }
  function goHome() { closeOv(); GAME.quit(); $('#hud').classList.remove('on'); show('home'); }
  function pauseGame() {
    if (!GAME.active || GAME.paused) return;
    GAME.pause(); ovKind = 'pause';
    overlay(`<h2>Paused</h2><p>${run.q ? esc(goalText(run.q)) : 'Score ' + fmt(lastScore)}</p><div class="acts"><button class="btn" data-act="resume">${ico('play')}Resume</button><div class="acts two" style="margin:0"><button class="btn ghost" data-act="home">Quit</button><button class="btn ghost" data-act="restart">Restart</button></div></div>`);
  }

  /* ---------------- clicks ---------------- */
  document.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    SFX.unlock();
    if (t.dataset.go) { SFX.tap(); show(t.dataset.go); return; }
    if (t.dataset.mode) { SFX.tap(); startRun({kind:t.dataset.mode, cfg:Object.assign({}, MODE[t.dataset.mode])}); return; }
    if (t.dataset.m) { SFX.tap(); brief('mission', +t.dataset.m); return; }
    if (t.dataset.daily) { SFX.tap(); brief('daily', 0); return; }
    if (t.dataset.tab) { shopTab = t.dataset.tab; drawShop(); return; }
    if (t.dataset.buy) {
      const id = t.dataset.buy, list = shopTab === 'blades' ? BLADES : THEMES, it = list.find(x => x.id === id), own = shopTab === 'blades' ? P.blades : P.themes;
      if (own.includes(id)) { if (shopTab === 'blades') P.blade = id; else P.theme = id; save(); applyLook(); SFX.tap(); drawShop(); return; }
      if (P.shards < it.price) { toast(`${shardImg}<span>You need ${fmt(it.price - P.shards)} more shards</span>`); SFX.thud(); return; }
      P.shards -= it.price; own.push(id); if (shopTab === 'blades') P.blade = id; else P.theme = id; save(); applyLook(); SFX.power();
      toast(`${shardImg}<span>Unlocked <b>${esc(it.name)}</b></span>`); drawShop(); checkAch(); return;
    }
    if (t.dataset.set) { const k = t.dataset.set; P.set[k] = !P.set[k]; save(); applySettings(); drawSettings(); if (k === 'sound' && P.set.sound) SFX.tap(); return; }
    const a = t.dataset.act; if (!a) return;
    if (a === 'close') { closeOv(); return; }
    if (a === 'start') { startRun(run); return; }
    if (a === 'again' || a === 'restart') { closeOv(); GAME.quit(); startRun(run); return; }
    if (a === 'next') { closeOv(); brief('mission', run.idx + 1); return; }
    if (a === 'home') { goHome(); return; }
    if (a === 'resume') { closeOv(); GAME.resume(); return; }
    if (a === 'upd') { window.UPD && UPD.check(); return; }
    if (a === 'reset') { ovKind = 'confirm'; overlay(`<h2>Reset everything?</h2><p>Your scores, shards, missions, blades and awards will be deleted. This can’t be undone.</p><div class="acts two"><button class="btn ghost" data-act="close">Cancel</button><button class="btn danger" data-act="doreset">Reset</button></div>`); return; }
    if (a === 'doreset') { P = blank(); save(); applySettings(); applyLook(); closeOv(); show('home'); toast('<span>Progress reset</span>'); }
  });
  $('#pausebtn').addEventListener('click', e => { e.stopPropagation(); pauseGame(); });
  $('#pausebtn').addEventListener('pointerdown', e => e.stopPropagation());

  function applySettings() { SFX.enabled = P.set.sound; window.__vibe = P.set.vibe; }
  // safe-area sizes for the game's own drawing
  function readInsets() { const cs = getComputedStyle(document.documentElement); window.__sat = parseFloat(cs.getPropertyValue('--sat')) || 0; window.__sab = parseFloat(cs.getPropertyValue('--sab')) || 0; }
  setInterval(readInsets, 1000); readInsets();

  window.onAndroidBack = () => {
    if (ovKind === 'pause') { closeOv(); GAME.resume(); return true; }
    if (ovKind === 'brief' || ovKind === 'confirm') { closeOv(); return true; }
    if (ovKind === 'result') { goHome(); return true; }
    if (GAME.active) { pauseGame(); return true; }
    if (screen !== 'home') { show('home'); return true; }
    return false;
  };
  document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
  window.__canReload = () => !GAME.active;

  applySettings(); applyLook(); show('home');
  window.__sc = {get P() { return P; }, startRun, brief, MISSIONS, MODE, missionCfg, dailyMission, show};
})();

</script>
</body>
</html>
