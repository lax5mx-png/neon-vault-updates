<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Shardcut</title>
<style>
:root{--sat:0px;--sab:0px;--ink:#f3efe6;--mute:#8e93a6;--panel:#1b1e29;--line:#2b3040;--pri:#ffc93c;--pri2:#ffc93c;--cy:#ffc93c;--gold:#ffc93c;--red:#ff5a4f;--sh:0 4px 0 #0b0d13}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#12141c;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;touch-action:none}
#cv{position:fixed;inset:0;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.ico{width:22px;height:22px;flex:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding:calc(14px + var(--sat)) 16px calc(16px + var(--sab));overflow-y:auto;touch-action:pan-y;z-index:5}
.screen.on{display:flex}
#home{background:#12141c}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:7px 13px 7px 9px;font-weight:900;font-size:15px}
.pill img{width:22px;height:22px}
.iconbtn{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--panel);border:2px solid var(--line)}
.logo{text-align:center;margin:34px 0 4px;position:relative}
.logo h1{margin:0;font-size:clamp(46px,15vw,68px);font-weight:900;font-style:italic;letter-spacing:-.04em;line-height:1;position:relative;z-index:1;display:inline-grid}
.logo h1 span{grid-area:1/1;color:var(--ink);text-shadow:0 5px 0 #0b0d13}
.logo h1 span.a{clip-path:polygon(0 0,100% 0,100% 38%,0 62%)}
.logo h1 span.b{clip-path:polygon(0 62%,100% 38%,100% 100%,0 100%);transform:translate(5px,4px);color:var(--pri)}
.logo .slash{display:none}
.logo p{margin:14px 0 0;color:var(--mute);font-weight:800;font-size:12.5px;letter-spacing:.18em;text-transform:uppercase}
.floaters{position:absolute;inset:-34px 0 auto;height:150px;pointer-events:none;z-index:0}
.floaters{display:none}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-10px) rotate(8deg)}}
.cards{display:grid;gap:10px;margin-top:22px}
.card{position:relative;text-align:left;border-radius:14px;padding:16px;background:var(--panel);border:2px solid var(--line);box-shadow:var(--sh);overflow:hidden;transition:transform .08s}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 #0b0d13}
.card h3{margin:0;font-size:20px;font-weight:900;letter-spacing:-.01em}
.card p{margin:4px 0 0;color:var(--mute);font-size:13.5px;line-height:1.35}
.card .best{position:absolute;right:16px;top:16px;text-align:right;font-size:11px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.card .best b{display:block;font-size:20px;color:var(--ink);letter-spacing:0}
.card.hero{background:var(--pri);border-color:#e0a91f;color:#17130a;padding:20px 16px;box-shadow:0 5px 0 #9a6e08}
.card.hero p{color:rgba(23,19,10,.75)}.card.hero .best{color:rgba(23,19,10,.6)}.card.hero .best b{color:#17130a}
.card.hero h3{font-size:26px}
.card .play{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:#17130a;color:var(--pri);font-weight:900;border-radius:99px;padding:8px 16px;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .card .best{position:static;text-align:left;margin-top:10px}
.tag{display:inline-block;font-size:10.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:#2b3040;margin-bottom:6px}
.tag.gold{background:var(--pri);color:#17130a}
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;border-radius:9px;background:var(--pri)}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 4px;border-radius:12px;background:var(--panel);border:2px solid var(--line);box-shadow:var(--sh);font-size:12px;font-weight:800;color:var(--mute);position:relative}
.nav button .ico{color:var(--ink)}
.nav .dot{position:absolute;top:8px;right:calc(50% - 22px);width:9px;height:9px;border-radius:50%;background:var(--pri);box-shadow:0 0 8px var(--pri)}
.head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.head h2{margin:0;font-size:24px;font-weight:900;flex:1}
.sub{color:var(--mute);font-size:13px}
/* missions */
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mt{aspect-ratio:1;border-radius:10px;background:var(--panel);border:2px solid var(--line);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:900;font-size:19px;position:relative}
.mt .st{font-size:10px;letter-spacing:1px;color:var(--gold)}.mt .st .off{color:rgba(255,255,255,.18)}
.mt.next{background:var(--pri);color:#17130a;border-color:#e0a91f;box-shadow:0 4px 0 #9a6e08}.mt.next .st{color:#17130a}
.mt.lock{opacity:.4}.mt.boss{border-color:#6c4a9e}
.mt .bossi{position:absolute;top:4px;right:6px;font-size:9px;color:#d9b8ff;font-weight:900}
/* shop */
.seg{display:flex;background:rgba(0,0,0,.3);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:10px;border-radius:11px;font-weight:800;color:var(--mute)}.seg button.on{background:rgba(255,255,255,.12);color:var(--ink)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.si{border-radius:12px;background:var(--panel);border:2px solid var(--line);box-shadow:var(--sh);padding:10px;text-align:left}
.si.eq{border-color:var(--pri)}
.si .pv{height:86px;border-radius:14px;position:relative;overflow:hidden;background:#0b0820}
.si .pv canvas{width:100%;height:100%;display:block}
.si b{display:block;margin:9px 2px 0;font-size:15px}
.si .pr{display:flex;align-items:center;gap:5px;margin:4px 2px 2px;font-weight:800;font-size:13px;color:var(--mute)}.si .pr img{width:16px;height:16px}
.si .pr.can{color:var(--gold)}
.si{position:relative;border-top:3px solid var(--rc)}
.si.eq{border-color:var(--pri);border-top-color:var(--rc)}
.si.lock .pv canvas{filter:saturate(.6) brightness(.72)}
.seg,.sgrid,.vault{flex-shrink:0}
.si .lk{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.75)}.si .lk .ico{width:22px;height:22px}
.si .pr i{font-style:normal;color:var(--rc);margin-right:auto;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase}
.si.r3 .pv,.si.r4 .pv,.si.r5 .pv{box-shadow:inset 0 0 0 1px var(--rc)}
.vault{flex-shrink:0;position:relative;border-radius:14px;padding:18px 16px 14px;margin:6px 0 14px;text-align:center;background:linear-gradient(180deg,#232637,#181a25);border:2px solid var(--line);box-shadow:var(--sh);overflow:hidden}
.vault:before{content:"";position:absolute;left:50%;top:-60px;width:260px;height:200px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(150,210,255,.22),transparent);pointer-events:none}
.vgem img{width:72px;height:72px;display:block;margin:0 auto;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(120,200,255,.35))}
.vault h3{margin:6px 0 2px;font-size:20px;font-weight:900}.vault p{margin:2px 0;color:var(--mute);font-size:13px;line-height:1.4}
.vault .odds{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;margin:10px 0;font-size:12px;font-weight:800}
.vbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 8px}.vbtns .btn{flex-direction:column;gap:2px;min-height:60px;padding:6px 8px;font-size:15px}
.vbtns .cost{display:inline-flex;align-items:center;gap:4px;font-size:13px;opacity:.8}.vbtns .cost img{width:14px;height:14px}
.vault .fine{font-size:11.5px}
.rvs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0 4px;max-height:58vh;overflow-y:auto;padding:4px}
.rvs.one{grid-template-columns:1fr}
.rv{position:relative;border-radius:12px;background:#12141c;border:2px solid var(--rc);padding:7px;text-align:left;opacity:0;animation:rvin .45s cubic-bezier(.2,.9,.3,1.25) forwards;overflow:hidden}
.rv .pv{height:58px;border-radius:8px;overflow:hidden;background:#0c0e15}.rv .pv canvas{width:100%;height:100%;display:block}
.rv.big .pv{height:150px}
.rv b{display:block;margin-top:6px;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rv.big b{font-size:20px}
.rv .rr{display:block;font-size:10.5px;font-weight:800;color:var(--rc);text-transform:uppercase;letter-spacing:.05em}
.rv .new,.rv .dup{position:absolute;top:10px;right:10px;font-size:10.5px;font-weight:900;padding:3px 6px;border-radius:6px}
.rv .new{background:var(--rc);color:#12141c}.rv .dup{display:flex;align-items:center;gap:3px;background:rgba(0,0,0,.6);color:var(--gold)}.rv .dup img{width:11px;height:11px}
.rv.r3{box-shadow:0 0 14px -2px var(--rc)}.rv.r4{box-shadow:0 0 22px 0 var(--rc)}
.rv.r3:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);animation:shine 1.6s 1s ease-in-out infinite;pointer-events:none}
@keyframes rvin{0%{opacity:0;transform:perspective(500px) rotateY(85deg) scale(.7)}100%{opacity:1;transform:none}}
@keyframes shine{60%,100%{transform:translateX(120%)}}
.seg.four button{padding:8px 2px;font-size:13px;line-height:1.15}.seg.four small{display:block;font-size:10.5px;opacity:.7;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px;flex-shrink:0;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex-shrink:0;padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:800;color:var(--rc,var(--mute));background:rgba(255,255,255,.06);border:1.5px solid transparent}
.chips button.on{border-color:var(--rc,var(--ink));color:var(--rc,var(--ink));background:rgba(255,255,255,.12)}
.more{width:100%;margin:12px 0 8px;flex-shrink:0}
.odds .div{background:linear-gradient(90deg,#ff6a8a,#ffd36a,#6affb0,#6ac8ff,#c56aff);-webkit-background-clip:text;background-clip:text;color:transparent!important}
.si.r6{border-top-color:transparent;background-image:linear-gradient(var(--panel),var(--panel)),linear-gradient(90deg,#ff6a8a,#ffd36a,#6affb0,#6ac8ff,#c56aff);background-origin:border-box;background-clip:padding-box,border-box}
.si.r6 .pr i,.rv.r6 .rr{background:linear-gradient(90deg,#ff6a8a,#ffd36a,#6affb0,#6ac8ff,#c56aff);-webkit-background-clip:text;background-clip:text;color:transparent}
.rv.r5{box-shadow:0 0 22px 0 var(--rc)}.rv.r6{border-color:#fff;box-shadow:0 0 18px 2px #ff6a8a,0 0 30px 4px #6ac8ff;animation:rvin .45s cubic-bezier(.2,.9,.3,1.25) forwards,hue 3s linear infinite}
.rv.r4:after,.rv.r5:after,.rv.r6:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);animation:shine 1.6s 1s ease-in-out infinite;pointer-events:none}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.reels{position:relative;display:flex;flex-direction:column;gap:6px;margin:14px -6px 12px;padding:8px 0;border-radius:12px;background:#0b0d13;border:2px solid var(--line);overflow:hidden}
.reel{overflow:hidden;height:var(--ch);position:relative}
.reel:before,.reel:after{content:"";position:absolute;top:0;bottom:0;width:38px;z-index:2;pointer-events:none}.reel:before{left:0;background:linear-gradient(90deg,#0b0d13,transparent)}.reel:after{right:0;background:linear-gradient(-90deg,#0b0d13,transparent)}
.strip{display:flex;height:100%;will-change:transform}
.rc{flex:0 0 var(--cw);height:100%;padding:3px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:linear-gradient(180deg,#1c1f2b,#14161f);border-right:1px solid #0b0d13;border-bottom:4px solid var(--rc)}
.rc img{width:100%;flex:1;min-height:0;object-fit:cover;border-radius:6px}
.reels.one .rc img{flex:0 0 78px}
.rc b{font-size:11px;line-height:1.15;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#e8e4da}
.rc.r6{border-bottom-color:#ff6a8a;border-image:linear-gradient(90deg,#ff6a8a,#ffd36a,#6affb0,#6ac8ff,#c56aff) 0 0 1 0}
.rc.hit{z-index:1;box-shadow:0 0 0 2px var(--rc),0 0 22px 2px var(--rc);animation:hitpop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes hitpop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.reels .mark{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:#ffc93c;box-shadow:0 0 10px #ffc93c;z-index:3}
.reels .mark:before,.reels .mark:after{content:"";position:absolute;left:-6px;border:7px solid transparent}.reels .mark:before{top:0;border-top-color:#ffc93c}.reels .mark:after{bottom:0;border-bottom-color:#ffc93c}

.showcase{flex-shrink:0;display:block;position:relative;width:100%;height:128px;border-radius:14px;overflow:hidden;border:2px solid var(--line);margin:4px 0 14px;padding:0;background:#0c0e15;box-shadow:var(--sh)}
.showcase canvas{width:100%;height:100%;display:block}.showcase .sc-l{position:absolute;left:10px;bottom:8px;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.45);padding:3px 7px;border-radius:6px}
.card.boss{background:linear-gradient(135deg,#2a1a3d,#1b1e29 70%);border-color:#5a3a80}.card.boss h3{color:#e2c6ff}
.nav button{position:relative}.nav .free{position:absolute;top:2px;right:6px;background:#7cf2a0;color:#0b1a10;font-size:9.5px;font-weight:900;padding:2px 5px;border-radius:5px;letter-spacing:.04em}
.btn.freeb{width:100%;margin:10px 0 2px;background:#7cf2a0;border-color:#4cc77a;color:#0b1a10;box-shadow:0 4px 0 #2e8a50}
.cgoal{margin:10px 0 4px;text-align:left}.cgoal .gl{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mute);gap:8px}.cgoal .gl b{color:var(--ink);display:inline-flex;align-items:center;gap:3px}.cgoal .gl img{width:12px;height:12px}
.cgoal .bar{height:6px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:5px;overflow:hidden}.cgoal .bar i{display:block;height:100%;background:var(--pri)}



/* list rows */
.list{display:flex;flex-direction:column;gap:8px}
.lr{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;background:var(--panel);border:2px solid var(--line)}
.lr .t{flex:1;min-width:0}.lr .t b{display:block;font-size:15px}.lr .t span{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.lr .v{font-weight:900;font-size:17px}
.lr .badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.07);flex:none}
.lr.done .badge{background:var(--pri);color:#17130a}
.lr .bar{margin-top:7px}
.sw{width:50px;height:30px;border-radius:99px;background:rgba(255,255,255,.15);position:relative;flex:none;transition:.2s}.sw::after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--pri)}.sw.on::after{background:#17130a}.sw.on::after{left:23px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:12px;font-weight:900;font-size:16px;background:var(--pri);color:#17130a;box-shadow:0 4px 0 #9a6e08}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9a6e08}
.btn.ghost{background:#2b3040;color:var(--ink);box-shadow:0 4px 0 #0b0d13}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.danger{background:rgba(255,77,94,.18);color:#ff8a95;box-shadow:none}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + var(--sat)) 14px 0;display:none;z-index:4;pointer-events:none}
#hud.on{display:block}
.hrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.score{font-size:44px;font-weight:900;line-height:1;letter-spacing:-.03em;text-shadow:0 4px 0 #0b0d13;font-variant-numeric:tabular-nums}
.hbest{font-size:12px;font-weight:800;color:var(--mute);margin-top:4px;letter-spacing:.04em}
.hright{display:flex;align-items:center;gap:10px}
.lives{display:flex;gap:4px}
.lives i{width:28px;height:28px;display:grid;place-items:center;color:rgba(255,255,255,.22)}
.lives i.lost{color:#ff4d5e;filter:drop-shadow(0 0 6px #ff4d5e)}
.lives svg{width:100%;height:100%}
.timer{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;min-width:56px;text-align:right}
.timer.low{color:#ff5a6e;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
#pausebtn{pointer-events:auto;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(0,0,0,.3);border:1px solid var(--line)}
.goal{margin-top:10px;display:none;max-width:320px}
.goal.on{display:block}
.goal span{font-size:12.5px;font-weight:800;color:#e9e1ff}
.goal .bar{height:6px;margin-top:6px}
.powers{display:flex;gap:6px;margin-top:8px}
.pw{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.35);border-radius:99px;padding:4px 10px 4px 5px;font-size:11.5px;font-weight:900}
.pw img{width:20px;height:20px}.pw i{display:block;width:44px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}.pw i b{display:block;height:100%;background:#fff}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(8,9,14,.72)}
.ov.on{display:flex}
.box{width:100%;max-width:380px;border-radius:16px;background:var(--panel);border:2px solid var(--line);padding:24px 20px 20px;text-align:center;box-shadow:0 6px 0 #0b0d13;animation:popin .25s cubic-bezier(.2,.9,.3,1.3)}
@keyframes popin{from{transform:scale(.88);opacity:0}}
.box h2{margin:0;font-size:28px;font-weight:900;letter-spacing:-.01em}
.box .kick{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--cy);margin-bottom:6px}
.box p{color:var(--mute);margin:8px 0 0;font-size:14.5px;line-height:1.45}
.box .big{font-size:64px;font-weight:900;line-height:1;margin:14px 0 4px;letter-spacing:-.04em;text-shadow:0 5px 0 #0b0d13}
.box .stars{font-size:40px;letter-spacing:6px;margin:10px 0 0;color:rgba(255,255,255,.15)}
.box .stars b{color:var(--gold)}
.box .rows{margin:14px 0 4px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box .rows div{background:#12141c;border-radius:10px;padding:10px}.box .rows b{display:block;font-size:19px}.box .rows span{font-size:11.5px;color:var(--mute);font-weight:700}
.box .acts{display:grid;gap:8px;margin-top:18px}
.box .acts.two{grid-template-columns:1fr 1fr}
.earn{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-weight:900;color:var(--gold);background:#12141c;padding:7px 14px;border-radius:8px}
.earn img{width:20px;height:20px}
.rules{text-align:left;margin:14px 0 0;padding:0;list-style:none;display:grid;gap:7px}
.rules li{display:flex;gap:10px;align-items:center;background:#12141c;border-radius:10px;padding:10px 12px;font-size:14px;font-weight:700}
.rules li .ico{width:20px;height:20px;color:var(--cy)}
.newbest{display:inline-block;margin-top:6px;font-size:12px;font-weight:900;letter-spacing:.1em;color:#2a1300;background:var(--gold);border-radius:99px;padding:4px 10px}

<body>
<canvas id="cv"></canvas>

    <div class="hright"><div class="lives" id="hlives"></div><div class="timer" id="htimer"></div><button id="pausebtn" aria-label="Pause"><svg class="ico" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></button></div>

</div>

<div class="ov" id="ov"><div class="box" id="ovbox"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* Shardcut artwork: gems, power gems, bombs and geodes, drawn once into small canvases (sprites) and reused every frame. */
(function () {
  const GEMS = {
    ruby:     {name:'Ruby', color:'red', c1:'#ff5470', c2:'#a3092c', glow:'#ff2d55', shape:'hex'},
    sapphire: {name:'Sapphire', color:'blue', c1:'#5cb3ff', c2:'#0c3a9e', glow:'#2f8cff', shape:'round'},
    emerald:  {name:'Emerald', color:'green', c1:'#4cf59a', c2:'#07704a', glow:'#22e07a', shape:'emerald'},
    amethyst: {name:'Amethyst', color:'purple', c1:'#cf96ff', c2:'#5a1aa8', glow:'#b061ff', shape:'prism'},
    topaz:    {name:'Topaz', color:'yellow', c1:'#ffe066', c2:'#b77a06', glow:'#ffcc1a', shape:'rhombus'},
    citrine:  {name:'Citrine', color:'orange', c1:'#ffab4d', c2:'#ad420a', glow:'#ff801a', shape:'trillion'},
    rose:     {name:'Rose quartz', color:'pink', c1:'#ff9ccf', c2:'#b02a6e', glow:'#ff5fb0', shape:'heart'},
    aqua:     {name:'Aquamarine', color:'cyan', c1:'#7af8f3', c2:'#0a7d8a', glow:'#20e0e0', shape:'cube'},
    diamond:  {name:'Diamond', color:'white', c1:'#ffffff', c2:'#8fb3cf', glow:'#cfeeff', shape:'round', rare:true}
  };
  const KINDS = Object.keys(GEMS).filter(k => !GEMS[k].rare);
  const COLOR_NAMES = {red:'red', blue:'blue', green:'green', purple:'purple', yellow:'yellow', orange:'orange', pink:'pink', cyan:'cyan', white:'white'};
  const POWERS = {
    freeze: {name:'Freeze', c1:'#e6fbff', c2:'#3aa6d8', glow:'#9fe8ff', shape:'cube', icon:'snow'},
    frenzy: {name:'Frenzy', c1:'#fff1a8', c2:'#d98a00', glow:'#ffd21f', shape:'star', icon:'bolt'},
    double: {name:'Double', c1:'#c6ffb0', c2:'#2f9a17', glow:'#7dff4d', shape:'hex', icon:'x2'}
  };

  const SHAPES = {
    hex: [...Array(6)].map((_, i) => [Math.cos(-Math.PI / 2 + i * Math.PI / 3), Math.sin(-Math.PI / 2 + i * Math.PI / 3)]),
    round: [...Array(10)].map((_, i) => [Math.cos(-Math.PI / 2 + i * Math.PI / 5), Math.sin(-Math.PI / 2 + i * Math.PI / 5)]),
    emerald: [[-.52, -.86], [.52, -.86], [.8, -.58], [.8, .58], [.52, .86], [-.52, .86], [-.8, .58], [-.8, -.58]],
    prism: [[0, -1], [.52, -.56], [.52, .7], [.24, .96], [-.24, .96], [-.52, .7], [-.52, -.56]],
    rhombus: [[0, -1], [.74, 0], [0, 1], [-.74, 0]],
    trillion: [[0, -1], [.18, -.72], [.9, .46], [.78, .6], [-.78, .6], [-.9, .46], [-.18, -.72]],
    star: [...Array(10)].map((_, i) => { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? .48 : 1; return [Math.cos(a) * r, Math.sin(a) * r]; })
  };

  function mk(size) { const c = document.createElement('canvas'); c.width = c.height = Math.ceil(size); return c; }
  const LIGHT = [-.55, -.83]; // light from the top left

  function facetGem(g, pts, R, d, inset) {
    const P = pts.map(([x, y]) => [x * R, y * R]);
    const I = pts.map(([x, y]) => [x * R * (inset || .52), y * R * (inset || .52) - R * .06]);
    const path = a => { g.beginPath(); a.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); };
    // glow + body
    g.save(); g.shadowColor = d.glow; g.shadowBlur = R * .55;
    const gr = g.createLinearGradient(-R, -R, R, R); gr.addColorStop(0, d.c1); gr.addColorStop(1, d.c2);
    path(P); g.fillStyle = gr; g.fill(); g.restore();
    // facets, shaded by how they face the light
    for (let i = 0; i < P.length; i++) {
      const j = (i + 1) % P.length, mx = (P[i][0] + P[j][0]) / 2, my = (P[i][1] + P[j][1]) / 2, l = Math.hypot(mx, my) || 1;
      const dot = (mx / l) * LIGHT[0] + (my / l) * LIGHT[1];
      g.beginPath(); g.moveTo(P[i][0], P[i][1]); g.lineTo(P[j][0], P[j][1]); g.lineTo(I[j][0], I[j][1]); g.lineTo(I[i][0], I[i][1]); g.closePath();
      g.fillStyle = dot > 0 ? `rgba(255,255,255,${.12 + dot * .32})` : `rgba(0,0,0,${.08 - dot * .3})`; g.fill();
      // a split down each facet adds sparkle
      if (i % 2 === 0) { g.beginPath(); g.moveTo(mx, my); g.lineTo((I[i][0] + I[j][0]) / 2, (I[i][1] + I[j][1]) / 2); g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = R * .02; g.stroke(); }
    }
    // table (top face)
    const tg = g.createLinearGradient(0, -R * .6, 0, R * .5); tg.addColorStop(0, 'rgba(255,255,255,.55)'); tg.addColorStop(.55, 'rgba(255,255,255,.1)'); tg.addColorStop(1, 'rgba(255,255,255,.22)');
    path(I); g.fillStyle = d.c1; g.fill(); g.fillStyle = tg; g.fill();
    g.lineJoin = 'round';
    for (let i = 0; i < P.length; i++) { g.beginPath(); g.moveTo(P[i][0], P[i][1]); g.lineTo(I[i][0], I[i][1]); g.strokeStyle = 'rgba(255,255,255,.4)'; g.lineWidth = R * .025; g.stroke(); }
    path(I); g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = R * .03; g.stroke();
    // inner depth: dark core fading to bright edge, then a rim light on the lit side
    g.save(); path(P); g.clip();
    const dp = g.createRadialGradient(R * .1, R * .15, R * .1, 0, 0, R * 1.05); dp.addColorStop(0, 'rgba(0,0,0,0)'); dp.addColorStop(.7, 'rgba(0,0,0,.08)'); dp.addColorStop(1, 'rgba(0,0,0,.35)');
    g.fillStyle = dp; g.fillRect(-R, -R, 2 * R, 2 * R);
    const sh = g.createLinearGradient(-R, -R, R * .4, R * .4); sh.addColorStop(0, 'rgba(255,255,255,.5)'); sh.addColorStop(.45, 'rgba(255,255,255,0)');
    g.fillStyle = sh; g.fillRect(-R, -R, 2 * R, 2 * R);
    g.restore();
    path(P); g.strokeStyle = shade(d.c2, -.3); g.lineWidth = R * .06; g.stroke();
    g.save(); path(P); g.clip(); g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = R * .05; g.translate(R * .035, R * .05); path(P); g.stroke(); g.restore();
    glint(g, -R * .34, -R * .42, R * .22);
    g.fillStyle = 'rgba(255,255,255,.8)'; g.beginPath(); g.arc(R * .3, R * .38, R * .035, 0, 7); g.fill();
  }
  function cube(g, R, d) {
    const P = SHAPES.hex.map(([x, y]) => [x * R * .95, y * R * .95]);
    g.save(); g.shadowColor = d.glow; g.shadowBlur = R * .55; g.beginPath(); P.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); g.fillStyle = d.c2; g.fill(); g.restore();
    const face = (pts, col) => { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); g.fillStyle = col; g.fill(); g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = R * .03; g.stroke(); };
    face([P[0], P[1], [0, 0], P[5]], shade(d.c1, .25));
    face([P[5], [0, 0], P[3], P[4]], shade(d.c1, -.05));
    face([[0, 0], P[1], P[2], P[3]], shade(d.c2, .15));
    // frosty inner lines
    g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = R * .02;
    g.beginPath(); g.moveTo(-R * .5, -R * .05); g.lineTo(-R * .2, R * .45); g.moveTo(R * .25, R * .1); g.lineTo(R * .55, -R * .1); g.stroke();
    glint(g, -R * .2, -R * .55, R * .18);
  }
  function heart(g, R, d) {
    const path = () => { g.beginPath(); g.moveTo(0, R * .95); g.bezierCurveTo(-R * 1.25, R * .1, -R * .8, -R * 1.05, 0, -R * .45); g.bezierCurveTo(R * .8, -R * 1.05, R * 1.25, R * .1, 0, R * .95); g.closePath(); };
    g.save(); g.shadowColor = d.glow; g.shadowBlur = R * .55; const gr = g.createLinearGradient(-R, -R, R, R); gr.addColorStop(0, d.c1); gr.addColorStop(1, d.c2); path(); g.fillStyle = gr; g.fill(); g.restore();
    g.save(); path(); g.clip();
    // facet lines
    g.strokeStyle = 'rgba(255,255,255,.3)'; g.lineWidth = R * .03;
    [[0, -R * .45, 0, R * .95], [-R * .9, -R * .3, R * .25, R * .5], [R * .9, -R * .3, -R * .25, R * .5]].forEach(([a, b, c, e]) => { g.beginPath(); g.moveTo(a, b); g.lineTo(c, e); g.stroke(); });
    const hl = g.createRadialGradient(-R * .4, -R * .45, 0, -R * .4, -R * .45, R * .8); hl.addColorStop(0, 'rgba(255,255,255,.55)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = hl; g.fillRect(-R, -R, 2 * R, 2 * R); g.restore();
    path(); g.strokeStyle = shade(d.c2, -.2); g.lineWidth = R * .05; g.stroke();
    glint(g, -R * .42, -R * .5, R * .18);
  }
  function glint(g, x, y, s) {
    g.save(); g.translate(x, y); g.fillStyle = 'rgba(255,255,255,.95)';
    g.beginPath(); g.moveTo(0, -s); g.quadraticCurveTo(0, 0, s, 0); g.quadraticCurveTo(0, 0, 0, s); g.quadraticCurveTo(0, 0, -s, 0); g.quadraticCurveTo(0, 0, 0, -s); g.fill();
    g.restore();
  }
  function shade(hex, amt) {
    let [r, gg, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
    const f = v => Math.max(0, Math.min(255, Math.round(amt >= 0 ? v + (255 - v) * amt : v * (1 + amt))));
    return `rgb(${f(r)},${f(gg)},${f(b)})`;
  }
  function icon(g, R, kind) {
    g.save(); g.strokeStyle = '#fff'; g.fillStyle = '#fff'; g.lineWidth = R * .12; g.lineCap = 'round'; g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = R * .15;
    if (kind === 'snow') { for (let i = 0; i < 3; i++) { g.save(); g.rotate(i * Math.PI / 3); g.beginPath(); g.moveTo(0, -R * .5); g.lineTo(0, R * .5); g.moveTo(-R * .14, -R * .36); g.lineTo(0, -R * .24); g.lineTo(R * .14, -R * .36); g.moveTo(-R * .14, R * .36); g.lineTo(0, R * .24); g.lineTo(R * .14, R * .36); g.stroke(); g.restore(); } }
    if (kind === 'bolt') { g.beginPath(); g.moveTo(R * .1, -R * .55); g.lineTo(-R * .3, R * .08); g.lineTo(0, R * .08); g.lineTo(-R * .12, R * .55); g.lineTo(R * .32, -R * .1); g.lineTo(R * .02, -R * .1); g.closePath(); g.fill(); }
    if (kind === 'x2') { g.font = `900 ${R * .75}px system-ui,sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('2×', 0, R * .04); }
    g.restore();
  }

  function gemSprite(d, R, dpr) {
    const S = R * 3, c = mk(S * dpr), g = c.getContext('2d');
    g.scale(dpr, dpr); g.translate(S / 2, S / 2);
    if (d.shape === 'cube') cube(g, R, d);
    else if (d.shape === 'heart') heart(g, R, d);
    else facetGem(g, SHAPES[d.shape], R, d, d.shape === 'star' ? .45 : d.shape === 'round' ? .5 : .55);
    if (d.icon) icon(g, R, d.icon);
    return {c, S};
  }
  function geodeSprite(R, dpr) {
    const S = R * 2.8, c = mk(S * dpr), g = c.getContext('2d'); g.scale(dpr, dpr); g.translate(S / 2, S / 2);
    const pts = [...Array(14)].map((_, i) => { const a = i / 14 * Math.PI * 2, r = R * (.9 + .1 * Math.sin(i * 2.7) * Math.cos(i * 1.3)); return [Math.cos(a) * r, Math.sin(a) * r]; });
    g.save(); g.shadowColor = '#c084ff'; g.shadowBlur = R * .35;
    g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath();
    const rock = g.createRadialGradient(-R * .35, -R * .4, R * .1, 0, 0, R); rock.addColorStop(0, '#8b7f76'); rock.addColorStop(.7, '#4a403b'); rock.addColorStop(1, '#2a2320'); g.fillStyle = rock; g.fill(); g.restore();
    // crystal-lined opening
    g.save(); g.beginPath(); g.ellipse(R * .05, R * .05, R * .58, R * .5, -.3, 0, 7); g.clip();
    const inner = g.createRadialGradient(0, 0, 0, 0, 0, R * .6); inner.addColorStop(0, '#f6e6ff'); inner.addColorStop(.35, '#c084ff'); inner.addColorStop(1, '#3c0d6e'); g.fillStyle = inner; g.fillRect(-R, -R, 2 * R, 2 * R);
    for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2; g.beginPath(); g.moveTo(Math.cos(a) * R * .62, Math.sin(a) * R * .55); g.lineTo(Math.cos(a + .14) * R * .2, Math.sin(a + .14) * R * .18); g.lineTo(Math.cos(a + .3) * R * .62, Math.sin(a + .3) * R * .55); g.fillStyle = i % 2 ? 'rgba(255,255,255,.28)' : 'rgba(90,20,160,.35)'; g.fill(); }
    g.restore();
    g.beginPath(); g.ellipse(R * .05, R * .05, R * .58, R * .5, -.3, 0, 7); g.strokeStyle = '#d9c3b0'; g.lineWidth = R * .06; g.stroke();
    // rock speckles
    g.fillStyle = 'rgba(0,0,0,.25)'; for (let i = 0; i < 18; i++) { const a = i * 2.39, r = R * (.66 + (i % 4) * .07); g.beginPath(); g.arc(Math.cos(a) * r, Math.sin(a) * r, R * .035, 0, 7); g.fill(); }
    glint(g, -R * .45, -R * .55, R * .12);
    return {c, S};
  }

  /* ---------- gem skins: a tint (keeps each gem's own hue) + a material ---------- */
  const hex2hsl = h => { let r = parseInt(h.slice(1, 3), 16) / 255, g = parseInt(h.slice(3, 5), 16) / 255, b = parseInt(h.slice(5, 7), 16) / 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2; let hh = 0, s = 0; if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn); hh = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; hh /= 6; } return [hh, s, l]; };
  const hsl2hex = (h, s, l) => { const f = n => { const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l), c = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); return Math.round(Math.max(0, Math.min(1, c)) * 255).toString(16).padStart(2, '0'); }; return '#' + f(0) + f(8) + f(4); };
  const adj = (hex, fs, fl) => { const [h, s, l] = hex2hsl(hex); return hsl2hex(h, Math.max(0, Math.min(1, fs(s))), Math.max(0, Math.min(1, fl(l)))); };
  const TINTS = {
    classic: d => d,
    pastel: d => ({c1:adj(d.c1, s => s * .75, l => l * .4 + .55), c2:adj(d.c2, s => s * .7, l => l * .5 + .38), glow:adj(d.glow, s => s * .8, l => l * .5 + .45)}),
    deep: d => ({c1:adj(d.c1, s => s, l => l * .72), c2:adj(d.c2, s => s, l => l * .45), glow:d.glow}),
    neon: d => ({c1:adj(d.c1, s => s ? 1 : 0, l => .62), c2:adj(d.c2, s => s ? 1 : 0, l => .32), glow:adj(d.glow, s => s ? 1 : 0, l => .55)}),
    smoky: d => ({c1:adj(d.c1, s => s * .4, l => l * .85), c2:adj(d.c2, s => s * .4, l => l * .7), glow:adj(d.glow, s => s * .5, l => l)}),
    midnight: d => ({c1:adj(d.c1, s => s, l => Math.max(l, .62)), c2:adj(d.c2, s => s * .8, l => .1), glow:adj(d.glow, s => s, l => .6)})
  };
  const sRand = s => () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  // each material paints inside the gem's outline P (already scaled), with colours d
  const MATS = {
    toon(g, P, R, d) { fillP(g, P, d.c1); g.save(); pathP(g, P); g.clip(); g.translate(R * .25, R * .3); fillP(g, P, d.c2); g.restore(); g.save(); pathP(g, P); g.clip(); g.translate(R * .1, R * .12); fillP(g, P, d.c1); g.restore(); strokeP(g, P, '#0b0d13', R * .11); g.fillStyle = 'rgba(255,255,255,.85)'; g.beginPath(); g.ellipse(-R * .32, -R * .38, R * .16, R * .09, -.6, 0, 7); g.fill(); },
    glass(g, P, R, d, base) { g.globalAlpha = .5; g.drawImage(base.c, -base.S / 2, -base.S / 2, base.S, base.S); g.globalAlpha = 1; clipDo(g, P, () => { const gr = g.createLinearGradient(-R, -R, R, R); gr.addColorStop(0, 'rgba(255,255,255,.55)'); gr.addColorStop(.4, 'rgba(255,255,255,0)'); gr.addColorStop(.8, 'rgba(255,255,255,.12)'); g.fillStyle = gr; g.fillRect(-R, -R, 2 * R, 2 * R); }); strokeP(g, P, 'rgba(255,255,255,.75)', R * .05); glint(g, -R * .3, -R * .4, R * .28); },
    polka(g, P, R, d) { body(g, P, R, d); clipDo(g, P, () => { g.fillStyle = 'rgba(255,255,255,.45)'; for (let y = -R; y < R; y += R * .36) for (let x = -R + ((y / (R * .36)) & 1) * R * .18; x < R; x += R * .36) { g.beginPath(); g.arc(x, y, R * .07, 0, 7); g.fill(); } }); gloss(g, P, R); strokeP(g, P, shade(d.c2, -.35), R * .06); },

<script>
'use strict';
/* Sound effects made on the fly with Web Audio (no sound files). */
(function () {
  let ac = null, master = null, noiseBuf = null, on = true;
  function ctx(any) {
    if (!on && !any) return null;
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
      master = ac.createGain(); master.gain.value = .55; master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function noise(t0, dur, f0, f1, q, vol, type) {
    const a = ctx(); if (!a) return; const t = a.currentTime + (t0 || 0);
    const s = a.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = a.createBiquadFilter(); f.type = type || 'bandpass'; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = a.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * .5); s.stop(t + dur + .05);
  }
  function tone(t0, freq, dur, vol, type, f2) {
    const a = ctx(); if (!a) return; const t = a.currentTime + (t0 || 0);
    const o = a.createOscillator(); o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = a.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .05);
  }
  let lastSwish = 0;
  const SFX = {
    set enabled(v) { on = !!v; }, get enabled() { return on; },
    unlock() { ctx(); },
    swish() { const a = ctx(); if (!a || a.currentTime - lastSwish < .12) return; lastSwish = a.currentTime; noise(0, .16, 900 + Math.random() * 400, 4200, 1.4, .18); },
    shatter(pitch) {
      const p = pitch || 1; noise(0, .22, 5000, 1800, .9, .32, 'highpass');
      [1, 1.5, 2.01].forEach((m, i) => tone(i * .012, 1300 * p * m * (.95 + Math.random() * .1), .28 - i * .05, .09, 'triangle'));
    },
    perfect() { tone(0, 1568, .25, .12, 'sine'); tone(.06, 2093, .3, .1, 'sine'); },
    combo(n) { const base = 523.25; for (let i = 0; i < Math.min(n, 6); i++) tone(i * .055, base * Math.pow(2, [0, 4, 7, 12, 16, 19][i] / 12), .22, .12, 'square'); },

    thud() { tone(0, 180, .25, .25, 'sine', 70); noise(0, .15, 400, 120, 1, .2, 'lowpass'); },
    clink() { tone(0, 900 + Math.random() * 300, .12, .1, 'triangle'); noise(0, .08, 3000, 2000, 2, .12); },
    power() { [0, 4, 7, 12].forEach((s, i) => tone(i * .07, 659 * Math.pow(2, s / 12), .3, .1, 'sine')); },
    win() { [0, 4, 7, 12, 16].forEach((s, i) => tone(i * .1, 523.25 * Math.pow(2, s / 12), .45, .12, 'triangle')); },
    lose() { [7, 3, 0].forEach((s, i) => tone(i * .14, 392 * Math.pow(2, s / 12), .4, .12, 'triangle')); },
    tick() { tone(0, 1200, .05, .06, 'square'); },
    tap() { tone(0, 700, .06, .07, 'triangle'); }
  };
  /* ---- background music: generated, follows the game's pace (level 0..1) ---- */
  // A minor: Am - F - C - G. Each chord: root (bass) and three tones for the arpeggio.
  const CH = [[110, [440, 523.25, 659.25]], [87.31, [349.23, 440, 523.25]], [130.81, [392, 523.25, 659.25]], [98, [392, 493.88, 587.33]]];
  let mus = null;
  function mnote(t, f, dur, vol, type, cut) {
    const a = ac, o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + Math.min(.02, dur * .2)); g.gain.exponentialRampToValueAtTime(.0001, t + dur);

  }
  function mhat(t, vol) { const a = ac, sN = a.createBufferSource(); sN.buffer = noiseBuf; const f = a.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000; const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + .05); sN.connect(f); f.connect(g); g.connect(mus.out); sN.start(t, Math.random() * .5); sN.stop(t + .08); }

      mus = {out:a.createGain(), next:a.currentTime + .15, step:0, lvl:0}; mus.out.gain.setValueAtTime(.0001, a.currentTime); mus.out.gain.exponentialRampToValueAtTime(.55, a.currentTime + 1.2); mus.out.connect(master);

    }

  window.SFX = SFX;

    if (tl != null && tl <= 5 && tl > 0 && st.surviveLeft == null && tl !== hud.lastTick) { hud.lastTick = tl; SFX.tick(); }
    if (st.goal && run.q) { $('#hgoalt').textContent = goalShort(run.q) + '  ' + st.goal.v + ' / ' + st.goal.n; $('#hgoalb').style.width = (st.goal.v / st.goal.n * 100) + '%'; }
    const pw = [['freeze', 'FREEZE', st.freeze], ['dbl', '2× POINTS', st.dbl], ['frenzy', 'FRENZY', st.frenzy]].filter(x => x[2] > 0);
    $('#hpowers').innerHTML = pw.map(([k, l, v]) => `<div class="pw"><img src="${PWI[k]}" alt="">${l}<i><b style="width:${Math.min(1, v) * 100}%"></b></i></div>`).join('');
  }
  function result(res) {
    SFX.music(false);
    $('#hud').classList.remove('on');
    const r = run, s = P.st;
    s.games++; s.sliced += res.st.sliced; s.perfect += res.st.perfect; s.bestCombo = Math.max(s.bestCombo, res.st.bestCombo); s.combos += res.st.combos;
    s.geodes += res.st.geodes; s.bombs += res.st.bombs; s.time += res.time; s.diamonds += res.st.diamonds;
    let earned = 0, html = '';
    const rowsHtml = `<div class="rows"><div><b>${res.st.sliced}</b><span>Gems sliced</span></div><div><b>${res.st.bestCombo || 0}</b><span>Best combo</span></div><div><b>${res.st.perfect}</b><span>Perfect cuts</span></div><div><b>${res.st.geodes}</b><span>Geodes</span></div></div>`;
    if (!r.q) {
      const k = r.kind, isBest = res.score > P.best[k] && res.score > 0;
      if (isBest) P.best[k] = res.score;
      if (k === 'classic') s.classicLongest = Math.max(s.classicLongest, res.time);
      earned = Math.round(res.score * {classic:1, rush:.6, zen:.5, bossrush:.6}[k]);
      const title = res.reason === 'bomb' ? 'Boom!' : res.reason === 'time' ? 'Time’s up' : 'Game over';
      html = `<div class="kick">${k === 'bossrush' ? 'Boss rush' : k}</div><h2>${title}</h2>${k === 'bossrush' ? `<p>${res.st.bosses || 0} boss${res.st.bosses === 1 ? '' : 'es'} shattered</p>` : ''}<div class="big">${fmt(res.score)}</div>${isBest ? '<span class="newbest">NEW BEST</span>' : `<p>Best ${fmt(P.best[k])}</p>`}${rowsHtml}
        ${earned ? `<div class="earn">${shardImg}+${fmt(earned)} shards</div>` : ''}
        <div class="acts two"><button class="btn ghost" data-act="home">Menu</button><button class="btn" data-act="again">Play again</button></div>`;
      isBest ? SFX.win() : SFX.lose();
    } else {
      const q = r.q, won = res.won;
      const stars = won ? 1 + (res.misses === 0 ? 1 : 0) + (res.score >= q.par ? 1 : 0) : 0;
      if (r.kind === 'mission' && won) {
        const prev = P.stars[r.idx] || 0;
        if (!prev) earned += 40 + r.idx * 8;
        if (stars > prev) { earned += (stars - prev) * 15; P.stars[r.idx] = stars; }
      }
      if (r.kind === 'daily' && won && !dailyDone()) {
        const y = new Date(); y.setDate(y.getDate() - 1); const yk = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
        P.daily.streak = P.daily.date === yk ? P.daily.streak + 1 : 1; P.daily.date = today(); P.daily.total++; earned += 150;
      }
      const why = {bomb:'You hit a bomb.', lives:'Out of lives.', time:'Out of time.'}[res.reason] || '';
      const gp = q.goal === 'boss' ? (won ? 1 : 0) : null;
      const nextOk = r.kind === 'mission' && won && r.idx + 1 < MISSIONS.length;
      html = `<div class="kick">${r.kind === 'daily' ? 'Daily challenge' : 'Mission ' + (r.idx + 1)}</div><h2>${won ? 'Complete!' : 'Mission failed'}</h2>
        ${won ? `<div class="stars">${[1, 2, 3].map(k => k <= stars ? '<b>★</b>' : '★').join('')}</div>` : `<p>${why} ${esc(goalText(q))}.</p>`}
        <div class="big" style="font-size:48px">${fmt(res.score)}</div><p style="margin-top:0">points</p>${won && stars < 3 ? `<p style="font-size:13px">${stars === 2 ? 'For the last star' : 'For more stars'}: ${[res.misses ? 'no misses or bombs' : '', res.score < q.par ? q.par + '+ points' : ''].filter(Boolean).join(' and ')}</p>` : ''}
        ${rowsHtml}${earned ? `<div class="earn">${shardImg}+${fmt(earned)} shards</div>` : ''}
        <div class="acts ${nextOk ? '' : 'two'}">${nextOk ? `<button class="btn" data-act="next">Next mission</button><div class="acts two" style="margin:0"><button class="btn ghost" data-act="home">Menu</button><button class="btn ghost" data-act="again">Retry</button></div>` : `<button class="btn ghost" data-act="home">Menu</button><button class="btn" data-act="again">${won ? 'Play again' : 'Retry'}</button>`}</div>`;
      won ? SFX.win() : SFX.lose();
    }
    P.shards += earned; save();
    ovKind = 'result'; overlay(html);
    checkAch();
  }
  function goHome() { SFX.music(false); closeOv(); GAME.quit(); $('#hud').classList.remove('on'); show('home'); }
  function pauseGame() {
    if (!GAME.active || GAME.paused) return;
    GAME.pause(); SFX.music(false); ovKind = 'pause';
    overlay(`<h2>Paused</h2><p>${run.q ? esc(goalText(run.q)) : 'Score ' + fmt(lastScore)}</p><div class="acts"><button class="btn" data-act="resume">${ico('play')}Resume</button><div class="acts two" style="margin:0"><button class="btn ghost" data-act="home">Quit</button><button class="btn ghost" data-act="restart">Restart</button></div></div>`);
  }

  /* ---------------- clicks ---------------- */
  document.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    SFX.unlock();
    if (t.dataset.go) { SFX.tap(); show(t.dataset.go); return; }
    if (t.dataset.mode) { SFX.tap(); startRun({kind:t.dataset.mode, cfg:Object.assign({}, MODE[t.dataset.mode])}); return; }
    if (t.dataset.m) { SFX.tap(); brief('mission', +t.dataset.m); return; }
    if (t.dataset.daily) { SFX.tap(); brief('daily', 0); return; }
    if (t.dataset.tab) { shopTab = t.dataset.tab; shopShown = 40; SFX.tap(); drawShop(); return; }
    if (t.dataset.buy) {
      const it = SKINS.get(shopTab, t.dataset.buy);
      if (!owns(it)) { toast(`<span>Open the vault to find <b>${esc(it.name)}</b></span>`); SFX.thud(); return; }
      equip(it); SFX.tap(); drawShop(); return;
    }
    if (t.dataset.flt) { shopFilter = t.dataset.flt; shopShown = 40; SFX.tap(); drawShop(); return; }
    if (t.dataset.set) { const k = t.dataset.set; P.set[k] = !P.set[k]; save(); applySettings(); drawSettings(); if (k === 'sound' && P.set.sound) SFX.tap(); return; }
    const a = t.dataset.act; if (!a) return;
    if (a === 'close') { closeOv(); return; }
    if (a === 'pullfree') { SFX.tap(); openVault(1, true); return; }
    if (a === 'pull1' || a === 'pull10') { SFX.tap(); openVault(a === 'pull1' ? 1 : 10); if (!$('#ov').classList.contains('on')) drawShop(); return; }
    if (a === 'closepull') { closeOv(); drawShop(); return; }
    if (a === 'spinskip') { if (SPIN) SPIN.finish(); return; }
    if (a === 'equippull') { const it = lastPull[0].it; equip(it); SFX.tap(); closeOv(); shopTab = it.kind; shopFilter = 'all'; drawShop(); return; }
    if (a === 'more') { shopShown += 60; SFX.tap(); const y = $('#shop').scrollTop; drawShop(); $('#shop').scrollTop = y; return; }
    if (a === 'start') { startRun(run); return; }
    if (a === 'again' || a === 'restart') { closeOv(); GAME.quit(); startRun(run); return; }
    if (a === 'next') { closeOv(); brief('mission', run.idx + 1); return; }
    if (a === 'home') { goHome(); return; }
    if (a === 'resume') { closeOv(); GAME.resume(); if (P.set.music) SFX.music(true); return; }
    if (a === 'upd') { window.UPD && UPD.check(); return; }
    if (a === 'reset') { ovKind = 'confirm'; overlay(`<h2>Reset everything?</h2><p>Your scores, shards, missions, blades and awards will be deleted. This can’t be undone.</p><div class="acts two"><button class="btn ghost" data-act="close">Cancel</button><button class="btn danger" data-act="doreset">Reset</button></div>`); return; }
    if (a === 'doreset') { P = blank(); save(); applySettings(); applyLook(); closeOv(); show('home'); toast('<span>Progress reset</span>'); }
  });
  $('#pausebtn').addEventListener('click', e => { e.stopPropagation(); pauseGame(); });
  $('#pausebtn').addEventListener('pointerdown', e => e.stopPropagation());

  function applySettings() { SFX.enabled = P.set.sound; window.__vibe = P.set.vibe; }
  // safe-area sizes for the game's own drawing
  function readInsets() { const cs = getComputedStyle(document.documentElement); window.__sat = parseFloat(cs.getPropertyValue('--sat')) || 0; window.__sab = parseFloat(cs.getPropertyValue('--sab')) || 0; }
  setInterval(readInsets, 1000); readInsets();

  window.onAndroidBack = () => {
    if (ovKind === 'pause') { closeOv(); GAME.resume(); if (P.set.music) SFX.music(true); return true; }
    if (ovKind === 'brief' || ovKind === 'confirm') { closeOv(); return true; }
    if (ovKind === 'pull') { closeOv(); drawShop(); return true; }
    if (ovKind === 'spin') { if (SPIN) SPIN.finish(); return true; }
    if (ovKind === 'result') { goHome(); return true; }
    if (GAME.active) { pauseGame(); return true; }
    if (screen !== 'home') { show('home'); return true; }
    return false;
  };
  document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
  window.__canReload = () => !GAME.active;

  applySettings(); applyLook(); show('home');
  window.__sc = {get P() { return P; }, startRun, brief, MISSIONS, MODE, missionCfg, dailyMission, show};
})();

</script>
</body>
</html>
