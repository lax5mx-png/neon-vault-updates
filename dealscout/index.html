<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DealScout</title>
<style>
:root{
  --sat:0px;--sab:0px;
  --bg:#F2F4F1;--card:#FFFFFF;--ink:#111A14;--mute:#5E6B62;--line:#DDE3DD;--soft:#E7ECE6;
  --acc:#14A44D;--onacc:#FFFFFF;--hot:#E5484D;--gold:#C98A00;--blue:#2D6BD9;
  --good:#14A44D;--goodbg:#DFF5E6;--warn:#B76E00;--warnbg:#FFF0D6;--bad:#D12F35;--badbg:#FDE3E3;--unk:#6B7280;--unkbg:#ECEEF0;
  --shadow:0 1px 2px rgba(10,30,15,.06),0 6px 16px rgba(10,30,15,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0C110E;--card:#161D18;--ink:#E8F0EA;--mute:#93A398;--line:#253028;--soft:#1E2720;
  --acc:#7BE495;--onacc:#06220F;--hot:#FF6B6E;--gold:#F2C14E;--blue:#8CB8FF;
  --good:#7BE495;--goodbg:#173322;--warn:#F2C14E;--warnbg:#3A2E12;--bad:#FF7A7D;--badbg:#3D1A1C;--unk:#A3ACB5;--unkbg:#232A30;
  --shadow:0 1px 2px rgba(0,0,0,.45);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
img{display:block}
#app{display:flex;flex-direction:column;height:100%;padding-top:var(--sat)}
main{flex:1;overflow-y:auto;padding:0 14px calc(90px + var(--sab))}
.view{display:none}.view.on{display:block}
.top{display:flex;align-items:center;gap:10px;padding:14px 2px 6px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--acc);display:grid;place-items:center;color:var(--onacc)}
.logo svg{width:20px;height:20px}
.brand{flex:1}.brand b{display:block;font-size:17px;font-weight:850;line-height:1.1}.brand span{font-size:12px;color:var(--mute)}
.rig{display:flex;align-items:center;gap:6px;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:750;white-space:nowrap}
.rig svg{width:16px;height:16px;color:var(--acc)}
h1{font-size:28px;line-height:1.1;margin:10px 2px 2px;letter-spacing:-.5px;font-weight:850}
.sub{color:var(--mute);font-size:14px;margin:0 2px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 12px;margin:12px 0 4px;box-shadow:var(--shadow)}
.search input{flex:1;border:0;background:none;padding:13px 0;outline:none;font-size:16px}
.search svg{width:18px;height:18px;color:var(--mute);flex:none}
.search button{color:var(--mute);width:32px;height:32px;display:grid;place-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--soft);font-weight:700;font-size:14px;min-height:38px;white-space:nowrap}
.chip.on{background:var(--acc);color:var(--onacc)}
.chip.icon{display:flex;align-items:center;gap:6px}.chip.icon svg{width:16px;height:16px}
.chip .n{background:var(--acc);color:var(--onacc);border-radius:9px;font-size:11px;padding:1px 6px;margin-left:2px}
.statline{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin:4px 2px 8px}
.list{display:flex;flex-direction:column;gap:10px}
.deal{display:flex;gap:12px;background:var(--card);border-radius:16px;padding:10px;box-shadow:var(--shadow);text-align:left;width:100%;position:relative}
.deal .img{flex:none;width:118px;height:55px;border-radius:9px;overflow:hidden;background:var(--soft)}
.deal .img img{width:100%;height:100%;object-fit:cover}
.deal .mid{flex:1;display:flex;flex-direction:column;gap:4px}
.deal .t{font-weight:750;font-size:15px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.deal .meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.deal .right{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.price{font-weight:850;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.price.free{color:var(--acc)}
.was{font-size:12px;color:var(--mute);text-decoration:line-through;white-space:nowrap}
.off{background:var(--hot);color:#fff;font-weight:850;font-size:12px;border-radius:7px;padding:2px 6px;white-space:nowrap}
.tag{font-size:11.5px;font-weight:750;border-radius:7px;padding:2px 7px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.tag img{width:14px;height:14px;border-radius:3px}
.tag.store{background:var(--soft);color:var(--ink)}
.tag.rate{background:var(--soft)}
.tag.g{background:var(--goodbg);color:var(--good)}.tag.w{background:var(--warnbg);color:var(--warn)}.tag.b{background:var(--badbg);color:var(--bad)}.tag.u{background:var(--unkbg);color:var(--unk)}
.r-hi{color:var(--good)}.r-mid{color:var(--warn)}.r-lo{color:var(--bad)}
.more{display:flex;justify-content:center;padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:13px;font-weight:800;background:var(--acc);color:var(--onacc)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:11px}
.empty{text-align:center;padding:40px 16px;color:var(--mute)}
.empty h3{color:var(--ink);margin:6px 0;font-size:19px}
.spin{width:30px;height:30px;border-radius:50%;border:4px solid var(--soft);border-top-color:var(--acc);animation:sp .8s linear infinite;margin:24px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{height:76px;border-radius:16px;background:linear-gradient(90deg,var(--card),var(--soft),var(--card));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
/* free tab */
.fcard{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);margin-top:12px}
.fcard .hero{aspect-ratio:16/8.5;background:var(--soft);position:relative}
.fcard .hero img{width:100%;height:100%;object-fit:cover}
.fcard .hero img[alt='']{color:transparent}
.fcard .hero .badge{position:absolute;left:10px;top:10px;background:var(--acc);color:var(--onacc);font-weight:850;font-size:13px;border-radius:8px;padding:4px 9px}
.fcard .hero .badge.soon{background:#1E2720;color:#E8F0EA}
.fcard .body{padding:12px 14px 14px;display:flex;align-items:center;gap:10px}
.fcard .body .t{flex:1}.fcard .body b{display:block;font-size:17px}.fcard .body span{font-size:13px;color:var(--mute)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 6px}
.sec h2{font-size:17px;margin:0}
.sec span{font-size:13px;color:var(--mute)}
/* guide */
.gcard{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;margin-top:12px}
.gcard h3{margin:0 0 8px;font-size:17px;display:flex;align-items:center;gap:8px}
.gcard h3 i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-size:14px;background:var(--goodbg);color:var(--good);font-weight:850}
.when{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:14.5px}
.when b{white-space:nowrap}
.site{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.site:first-of-type{border-top:0}
.site .ic{width:38px;height:38px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-weight:850;font-size:14px;flex:none}
.site .tx{flex:1}.site .tx b{display:block;font-size:15px}.site .tx span{font-size:13px;color:var(--mute)}
.site svg{width:18px;height:18px;color:var(--mute);flex:none}
.cal{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.cal:first-of-type{border-top:0}
.cal .d{flex:none;width:58px;text-align:center;background:var(--soft);border-radius:10px;padding:6px 0;font-weight:850;font-size:13px;line-height:1.15}
.cal .d small{display:block;font-weight:700;color:var(--mute);font-size:11px}
.cal .x{flex:1;font-size:14px}.cal .x b{display:block}
.cal.live .d{background:var(--acc);color:var(--onacc)}.cal.live .d small{color:var(--onacc)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:var(--sab);z-index:6}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;font-size:12px;font-weight:700;color:var(--mute);position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--acc)}
nav.tabs .dot{position:absolute;top:5px;left:calc(50% + 8px);background:var(--hot);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;z-index:21;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:94%;overflow-y:auto;padding-bottom:calc(18px + var(--sab))}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:10px auto}
.sheet .pad{padding:0 18px}
.sheet h2{margin:4px 0 4px;font-size:22px;line-height:1.15}
.dhero{width:100%;aspect-ratio:460/215;object-fit:cover;background:var(--soft)}
.verdict{border-radius:14px;padding:12px 14px;margin-top:12px}
.verdict b{display:flex;align-items:center;gap:8px;font-size:16px}
.verdict.g{background:var(--goodbg);color:var(--good)}.verdict.w{background:var(--warnbg);color:var(--warn)}.verdict.b{background:var(--badbg);color:var(--bad)}.verdict.u{background:var(--unkbg);color:var(--unk)}
.verdict p{margin:4px 0 0;font-size:13.5px;color:var(--ink);opacity:.85}
.reqs{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;margin-top:8px;color:var(--ink)}
.reqs dt{font-weight:750;color:var(--mute)}.reqs dd{margin:0}
.ptable{margin-top:8px}
.prow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow img{width:22px;height:22px;border-radius:5px;flex:none}
.prow .s{flex:1;font-weight:700;font-size:14.5px}.prow .s small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.prow .pp{text-align:right;font-variant-numeric:tabular-nums}.prow .pp b{display:block;font-size:16px}.prow .pp small{font-size:12px;color:var(--mute)}
.prow.best{background:var(--goodbg);margin:0 -10px;padding:10px;border-radius:12px;border-top:0}
.prow.off{opacity:.45}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.facts div{background:var(--soft);border-radius:12px;padding:9px 10px}
.facts b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.facts span{font-size:11.5px;color:var(--mute)}
.desc{font-size:14px;color:var(--mute);margin-top:12px;line-height:1.5}
.row2{display:flex;gap:10px;margin-top:14px}.row2 .btn{flex:1}
label.f{display:block;font-size:13px;font-weight:750;color:var(--mute);margin:14px 0 6px}
.inp{width:100%;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:10px 12px;font-size:16px;outline:none}
.inp:focus{border-color:var(--acc)}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-height:56px}
.li:first-child{border-top:0}
.li .t{flex:1}.li .t small{display:block;color:var(--mute);font-size:12.5px}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(20px)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:40px;border-radius:10px;font-weight:700;font-size:14px}
.seg button.on{background:var(--card);color:var(--acc);box-shadow:var(--shadow)}
.storegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.storegrid button{display:flex;align-items:center;gap:8px;padding:10px;border-radius:12px;background:var(--soft);font-size:13.5px;font-weight:700;text-align:left;opacity:.5}
.storegrid button.on{opacity:1;outline:2px solid var(--acc)}
.storegrid img{width:20px;height:20px;border-radius:5px}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--sab));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.2s;z-index:50;pointer-events:none;max-width:92%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.wrow{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:10px;box-shadow:var(--shadow);width:100%;text-align:left}
.wrow .img{flex:none;width:92px;height:43px;border-radius:8px;overflow:hidden;background:var(--soft)}
.wrow .img img{width:100%;height:100%;object-fit:cover}
.wrow .mid{flex:1}.wrow .mid b{display:block;font-size:15px;line-height:1.2}.wrow .mid span{font-size:12.5px;color:var(--mute)}
.hit{outline:2.5px solid var(--acc)}
.note{font-size:12.5px;color:var(--mute);margin:10px 2px 0;line-height:1.45}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.tag.own{background:#E0EAFF;color:#2D55B5}
@media (prefers-color-scheme:dark){.tag.own{background:#1B2A4A;color:#9DBBFF}}
.ownbar{display:inline-block;margin:6px 0 2px;padding:5px 10px;border-radius:999px;background:#E0EAFF;color:#2D55B5;font-weight:800;font-size:13px}
@media (prefers-color-scheme:dark){.ownbar{background:#1B2A4A;color:#9DBBFF}}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.seg.sm{max-width:220px;margin:0 0 8px auto}.seg.sm button{min-height:32px;font-size:13px}
.phbox{position:relative;background:var(--card);border-radius:14px;padding:10px 10px 4px;box-shadow:var(--shadow);min-height:60px}
.phsvg{width:100%;height:180px;display:block;touch-action:pan-y}
.phsvg text{font-size:11px;fill:var(--mute);font-weight:600}
.phsvg .gl{stroke:var(--line);stroke-width:1}
.phsvg .reg{stroke:var(--mute);stroke-width:1.2;stroke-dasharray:4 4;opacity:.7}
.phsvg .ln{fill:none;stroke:var(--acc);stroke-width:2.4;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.phsvg .ar{fill:var(--acc);opacity:.12}
.phsvg .lo{fill:var(--gold);stroke:var(--card);stroke-width:2}
.phsvg .nw{fill:var(--acc);stroke:var(--card);stroke-width:2}
.phsvg .cur{stroke:var(--ink);stroke-width:1;opacity:.5}
.phtip{display:none;position:absolute;top:44px;width:120px;background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 8px;border-radius:9px;pointer-events:none;line-height:1.3}
.phleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mute);font-weight:600;margin-top:4px}
.phleg .k{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px;background:var(--acc)}
.phleg .k.reg{background:none;border-top:2px dashed var(--mute);height:0}.phleg .k.lo{width:9px;height:9px;border-radius:50%;background:var(--gold)}
.phempty{padding:6px 4px}.phempty b{font-size:15px}.phempty p{margin:4px 0;font-size:13.5px;color:var(--mute)}
</style>
</head>
<body>
<div id="app">
<main id="main">
  <div class="top">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5" fill="currentColor"/></svg></div>
    <div class="brand"><b>DealScout</b><span>PC deals that run on your laptop</span></div>
    <button class="rig" id="rigbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M1 20h22"/></svg><span id="rigtxt"></span></button>
  </div>

  <section class="view on" id="v-deals">
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Search any PC game" enterkeyhint="search" autocomplete="off"><button id="qx" style="display:none" aria-label="Clear">✕</button></div>
    <div class="chips" id="presets"></div>
    <div class="chips" id="fchips" style="padding-top:0"></div>
    <div class="statline"><span id="dstat"></span><span id="dupd"></span></div>
    <div class="list" id="dlist"></div>
    <div class="more" id="dmore"></div>
  </section>

  <section class="view" id="v-free">
    <h1>Free games</h1>
    <p class="sub">Free to keep forever once you claim them. Epic gives away a new one every Thursday.</p>
    <div id="flist"></div>
  </section>

  <section class="view" id="v-watch">
    <h1>Watchlist</h1>
    <p class="sub" id="wsub"></p>
    <div class="list" id="wlist" style="margin-top:12px"></div>
  </section>

  <section class="view" id="v-guide">
    <h1>Deal guide</h1>
    <p class="sub">When to check, where to check, and how to buy safely.</p>
    <div id="glist"></div>
  </section>
</main>
<nav class="tabs" id="tabs">
  <button data-v="deals" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.3" fill="currentColor"/></svg>Deals</button>
  <button data-v="free"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="5" rx="1"/><path d="M12 8v13M5 13v8h14v-8M12 8S10.5 3 7.5 3a2.5 2.5 0 0 0 0 5M12 8s1.5-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>Free<span class="dot" id="freedot" style="display:none"></span></button>
  <button data-v="watch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8-4.3-4.1 5.9-.9z"/></svg>Watchlist<span class="dot" id="watchdot" style="display:none"></span></button>
  <button data-v="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>Guide</button>
</nav>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script>
/* Shared update UI for the personal apps: update banner, "what's new", version info. */
(function () {

/* ---------- free games ---------- */
async function loadFree() {
  $('#flist').innerHTML = '<div class="spin"></div>';
  let epicNow = [], epicNext = [], others = [], err = 0;
  try {
    const e = await cached('https://store-site-backend-static.ak.epicgames.com/freeGamesPromotions?locale=en-US&country=US', 30 * 6e4);
    for (const x of e.data.Catalog.searchStore.elements) {
      const pr = x.promotions || {}; const pick = arr => { for (const a of arr || []) for (const o of a.promotionalOffers || []) if (o.discountSetting && o.discountSetting.discountPercentage === 0) return o; return null; };
      const now = pick(pr.promotionalOffers), next = pick(pr.upcomingPromotionalOffers);
      const im = (x.keyImages || []).find(k => k.type === 'OfferImageWide') || (x.keyImages || []).find(k => k.type === 'Thumbnail') || (x.keyImages || [])[0];
      const slug = x.productSlug && x.productSlug !== '[]' ? x.productSlug : (x.offerMappings && x.offerMappings[0] && x.offerMappings[0].pageSlug) || (x.catalogNs && x.catalogNs.mappings && x.catalogNs.mappings[0] && x.catalogNs.mappings[0].pageSlug) || '';
      const item = {title:x.title, img:im ? im.url : '', url:slug ? 'https://store.epicgames.com/p/' + slug.replace(/\/home$/, '') : 'https://store.epicgames.com/free-games', worth:x.price && x.price.totalPrice ? x.price.totalPrice.originalPrice / 100 : 0};
      if (now) epicNow.push(Object.assign(item, {end:now.endDate})); else if (next) epicNext.push(Object.assign(item, {start:next.startDate, end:next.endDate}));
    }
  } catch (e) { err++; }
  try { const f = await cached(CS + 'deals?upperPrice=0&pageSize=30&storeID=' + encodeURIComponent((S.stores || []).join(',')), 30 * 6e4); others = f.filter(d => !epicNow.some(e => e.title.toLowerCase() === d.title.toLowerCase())); } catch (e) { err++; }
  S.seenFree = epicNow.map(e => e.title).concat(others.map(o => o.title)); save(); updateDots();
  if (err === 2) { $('#flist').innerHTML = '<div class="empty"><h3>Couldn’t load free games</h3><p>Check your internet connection.</p><button class="btn" data-act="freeretry">Try again</button></div>'; return; }
  const fcard = (e, soon) => `<div class="fcard"><div class="hero">${e.img ? `<img loading="lazy" src="${esc(e.img)}" alt="">` : ''}<span class="badge${soon ? ' soon' : ''}">${soon ? 'Free from ' + fdate(e.start) : 'Free until ' + fdate(e.end)}</span></div>
    <div class="body"><div class="t"><b>${esc(e.title)}</b><span>${isOwned(null, e.title) ? '✓ You own this · ' : ''}Epic Games Store${e.worth ? ' · normally ' + money(e.worth) : ''}</span></div>${soon ? '' : `<button class="btn sm" data-open="${esc(e.url)}">Claim</button>`}</div></div>`;
  let h = `<div class="sec"><h2>Free now on Epic</h2><span>Claim it and it’s yours</span></div>` + (epicNow.length ? epicNow.map(e => fcard(e)).join('') : '<p class="sub">No free game listed right now. Check again Thursday.</p>');
  if (epicNext.length) h += `<div class="sec"><h2>Coming next</h2><span>Free from Thursday</span></div>` + epicNext.map(e => fcard(e, true)).join('');
  if (others.length) h += `<div class="sec"><h2>Free at other stores</h2><span>Limited time</span></div><div class="list">` + others.map(dealCard).join('') + '</div>';
  h += `<p class="note">You need a free Epic Games account and the Epic launcher to play Epic freebies. Claiming takes a minute and the game stays in your library for good.</p>`;
  $('#flist').innerHTML = h; others.forEach(d => requestCompat(d.steamAppID, d.title));
}

async function renderWatch(refresh) {
  const n = S.watch.length;
  $('#wsub').textContent = n ? `Checked every day at ${fmtTime(S.dailyT)}. You’ll get a notification when a price hits your target.` : '';
  if (!n) { $('#wlist').innerHTML = '<div class="empty"><h3>Nothing on your watchlist</h3><p>Open any game and tap “Watch price”. DealScout checks once a day and tells you when it hits your price.</p></div>'; updateDots(); return; }
  const draw = () => { $('#wlist').innerHTML = S.watch.map(w => { const hit = w.now != null && w.now <= w.target;
    return `<button class="wrow${hit ? ' hit' : ''}" data-game="${w.id}" data-app="${w.appid || ''}"><div class="img"><img loading="lazy" src="${esc(img(w.appid, w.thumb))}" onerror="if(this.dataset.f){this.style.visibility='hidden'}else{this.dataset.f=1;this.src='${esc(w.thumb)}'}" alt=""></div>
      <div class="mid"><b>${esc(w.title)}</b><span>Target ${money(w.target)}${w.low != null ? ' · lowest ever ' + money(w.low) : ''}</span></div>
      <div class="right" style="display:flex;flex-direction:column;align-items:flex-end"><span class="price${hit ? ' free' : ''}">${w.now != null ? money(w.now) : '…'}</span>${hit ? '<span class="tag g">At your price</span>' : w.now != null ? `<span class="was" style="text-decoration:none">${money(w.now - w.target)} to go</span>` : ''}</div></button>`; }).join(''); updateDots(); };
  draw();
  if (!refresh) return;
  try {
    for (let i = 0; i < n; i += 25) {
      const chunk = S.watch.slice(i, i + 25), r = await cached(CS + 'games?ids=' + chunk.map(w => w.id).join(','), 10 * 6e4);
      chunk.forEach(w => { const g = r[w.id]; if (!g) return; w.now = Math.min(...g.deals.map(d => +d.price)); recordPrice(w.id, w.now); w.low = g.cheapestPriceEver ? +g.cheapestPriceEver.price : null; });
    }
    save(); draw();
  } catch (e) { toast('Couldn’t refresh prices'); }
}
const fmtTime = t => { const [h, m] = t.split(':').map(Number); return (h % 12 || 12) + ':' + String(m).padStart(2, '0') + (h < 12 ? ' AM' : ' PM'); };
function updateDots() {
  const hits = S.watch.filter(w => w.now != null && w.now <= w.target).length; const d = $('#watchdot'); d.style.display = hits ? '' : 'none'; d.textContent = hits;
}

    const t = parseFloat($('#tgt').value); if (!(t >= 0)) { toast('Enter a price'); return; }
    let w = S.watch.find(x => x.id === curGame.id);
    if (!w) { w = {id:curGame.id, title:curGame.title, appid:curGame.appid, thumb:curGame.thumb}; S.watch.unshift(w); }
    w.target = t; w.now = Math.min(...curGame.g.deals.map(d => +d.price)); w.low = curGame.g.cheapestPriceEver ? +curGame.g.cheapestPriceEver.price : null;
    if (!S.daily) { S.daily = true; } save(); pushReminder(); buzz(15); toast('Watching. You’ll get a notification at ' + money(t) + ' or less'); renderGame(); if (view === 'watch') renderWatch();
  }
  else if (a === 'unwatch') { S.watch = S.watch.filter(x => x.id !== curGame.id); save(); toast('Removed from watchlist'); renderGame(); if (view === 'watch') renderWatch(); }
  else if (a === 'test') { if (A) { if (!A.canNotify()) { A.askNotifyPerm(); toast('Allow notifications, then tap Test again'); return; } syncNative(); A.testReminder(); toast('Checking now…'); } else toast('Alerts work in the Android app'); }
  else if (a === 'done' || a === 'apply') { closeSheet(); if (filtersDirty) { filtersDirty = false; renderRig(); renderPresets(); if (!searchMode) loadDeals(true); } }
  else if (a === 'anygenre') { S.genres = []; save(); filtersDirty = true; document.querySelectorAll('#fgen .chip').forEach(x => x.classList.remove('on')); }
  else if (a === 'own') { const i = S.mine.findIndex(m => m.id === curGame.id); if (i >= 0) S.mine.splice(i, 1); else S.mine.push({id:curGame.id, appid:curGame.appid || '', title:curGame.title}); rebuildOwned(); save(); toast(i >= 0 ? 'Unmarked' : 'Marked as owned' + (S.hideOwned ? '. It’s hidden from deals now.' : '')); renderGame(); filtersDirty = true; applyVis(); renderPresets(); }
  else if (a === 'import') { S.steamUser = $('#suser').value.trim(); S.steamKey = $('#skey').value.trim(); save(); b.disabled = true; b.textContent = 'Importing…'; steamImport(false).then(ok => { if (ok) { filtersDirty = true; openSettings(); } else { b.disabled = false; b.textContent = 'Import library'; } }); }
  else if (a === 'itadtest') { S.itadKey = $('#sitad').value.trim(); save(); if (!S.itadKey) { toast('Paste your key first'); return; } get(ITAD + 'games/lookup/v1?key=' + encodeURIComponent(S.itadKey) + '&appid=1086940').then(r => toast(r && r.found ? 'Key works' : 'Key accepted, but the test game wasn’t found')).catch(e => toast(/40[13]/.test(String(e)) ? 'IsThereAnyDeal rejected that key' : 'Couldn’t reach IsThereAnyDeal')); }
  else if (a === 'updchk') { window.UPD && UPD.check(); }
  else if (a === 'allstores') { S.stores = Object.keys(STORES).filter(id => STORES[id].active); save(); filtersDirty = true; openFilters(); }
});
$('#sheet').addEventListener('change', e => {
  if (e.target.id === 'sgpu') { S.gpu = +e.target.value; save(); filtersDirty = true; }
  if (e.target.id === 'sdisk') { S.disk = Math.max(0, +e.target.value || 0); save(); }
  if (e.target.id === 'stime' && e.target.value) { S.dailyT = e.target.value; save(); pushReminder(); }
  if (e.target.id === 'suser') { S.steamUser = e.target.value.trim(); save(); }
  if (e.target.id === 'skey') { S.steamKey = e.target.value.trim(); save(); }
  if (e.target.id === 'sitad') { S.itadKey = e.target.value.trim(); save(); }
});
document.addEventListener('click', e => {
  if (e.target.closest('#sheet')) return;
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.game) { openGame(b.dataset.game, b.dataset.app); return; }
  if (b.dataset.preset) { S.preset = b.dataset.preset; save(); renderPresets(); if (searchMode) { searchMode = false; $('#q').value = ''; $('#qx').style.display = 'none'; } loadDeals(true); return; }
  if (b.dataset.open) { openUrl(b.dataset.open); return; }
  if (b.dataset.v) { go(b.dataset.v); return; }
  const a = b.dataset.act;
  if (a === 'filters') openFilters();
  else if (a === 'hideno') { S.hideNo = !S.hideNo; save(); renderPresets(); loadDeals(true); }
  else if (a === 'hideown') { S.hideOwned = !S.hideOwned; save(); renderPresets(); loadDeals(true); }
  else if (a === 'genres') openFilters();
  else if (a === 'rate') { S.minRate = S.minRate === 0 ? 80 : S.minRate === 80 ? 90 : 0; save(); renderPresets(); loadDeals(true); }
  else if (a === 'more') loadDeals(false);
  else if (a === 'retry') loadDeals(true);
  else if (a === 'freeretry') loadFree();
  else if (b.id === 'rigbtn') openSettings();
  else if (b.id === 'qx') exitSearch();
});
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { const q = e.target.value.trim(); if (q) { e.target.blur(); doSearch(q); } } });
$('#q').addEventListener('input', e => { $('#qx').style.display = e.target.value ? '' : 'none'; });
$('#main').addEventListener('scroll', () => { const m = $('#main'); if (view === 'deals' && !searchMode && !dend && !dloading && dcount && m.scrollTop + m.clientHeight > m.scrollHeight - 600) loadDeals(false); });

let view = 'deals';
function go(v) {
  view = v; document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); $('#main').scrollTop = 0;
  if (v === 'free') loadFree(); else if (v === 'watch') renderWatch(true); else if (v === 'guide') renderGuide();
}
function renderRig() { $('#rigtxt').textContent = GPUS[S.gpu][0].replace(/ Laptop| \(.*\)/g, '') + ' · ' + S.ram + ' GB'; }
window.onAndroidBack = () => { if (sheetOpen) { closeSheet(); return true; } if (searchMode) { exitSearch(); return true; } if (view !== 'deals') { go('deals'); return true; } return false; };
window.onAppResume = () => { syncNative(); };
window.__ds = {S:() => S, COMPAT:() => COMPAT, verdict, parseReq, gpuScore, openGame, go, rebuildOwned, steamImport, itadHistory, get PH() { return PH; }};
window.__toast = toast;
window.__canReload = () => !sheetOpen;
(async () => {
  for (const k in blank()) if (S[k] === undefined) S[k] = blank()[k];
  rebuildOwned(); renderRig(); await loadStores(); renderPresets(); loadDeals(true); syncNative(); pushReminder();
  // keep the Steam library fresh (weekly)
  if (S.steamKey && S.steamUser && (!S.owned.at || Date.now() - Date.parse(S.owned.at) > 7 * 864e5)) steamImport(true).then(ok => { if (ok) applyVis(); });
})();
}

</script>
